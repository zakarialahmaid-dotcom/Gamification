    const nudge=$('rs-rank-nudge');
    if(!players||players.length<1)return;
    const myScore=s;
    const p3=players[2]; // 3rd place (0-indexed)
    const myRank=players.findIndex(function(p){return p.score<=myScore;})+1||players.length+1;

    // Re-render prize board highlighting the player's winning row if Top 3
    var pbWrap=$('rs-prizeboard');
    if(pbWrap){pbWrap.innerHTML=prizeBoardHTML({variant:'light',myRank:myRank<=3?myRank:0});}

    let html='';
    if(myRank<=3){
      var pz=prizeFor(myRank);
      html='<div style="background:#fff8ee;border:1.5px solid rgba(255,153,0,.45);border-radius:12px;padding:clamp(12px,3vw,14px) clamp(14px,3.5vw,18px);margin:0 0 clamp(12px,3vw,16px);text-align:center;"><div style="font-size:clamp(12px,3vw,14px);font-weight:900;color:#403b3b;font-family:var(--H1);">TU ES #'+myRank+' — EN LICE POUR '+pz.amount+' DH !</div><div style="font-size:clamp(10px,2.5vw,11.5px);color:#e68800;font-family:var(--H2);font-weight:700;margin-top:3px;">Garde ta place dans le Top 3 jusqu\'à la fin de la manche.</div></div>';
    } else if(p3){
      const gap3=Math.max(0,p3.score-myScore)+1;
      html='<div style="background:#fff8ee;border:1.5px solid rgba(255,153,0,.4);border-radius:12px;padding:clamp(12px,3vw,14px) clamp(14px,3.5vw,18px);margin:0 0 clamp(12px,3vw,16px);text-align:center;"><div style="font-size:clamp(11px,2.8vw,13px);font-weight:900;color:#403b3b;font-family:var(--H1);">Plus que <b style="color:#ff9900;">'+Number(gap3).toLocaleString('fr-FR')+' pts</b> pour le Top 3</div><div style="font-size:clamp(10px,2.5vw,11.5px);color:#777777;font-family:var(--H2);font-weight:700;margin-top:3px;">Rejoue et vise les 500 DH — ou plus !</div></div>';
    }
    if(html&&nudge)nudge.innerHTML=html;

    // Update leaderboard button with live rank context
    if(lbdBtn){
      if(myRank<=3){lbdBtn.innerHTML=IC.trophy+' MON CLASSEMENT — #'+myRank;}
      else if(p3){lbdBtn.innerHTML=IC.trophy+' TOP 3 À '+(Math.max(0,p3.score-myScore)+1>0?Number(Math.max(0,p3.score-myScore)+1).toLocaleString('fr-FR')+' pts':'0 pt');}
    }
    if(typeof fitCurrent==='function')fitCurrent();
  }).catch(function(){});
}

function _sendVoucher(el){
  var code=el&&el.getAttribute?el.getAttribute('data-code'):'';
  var disc=el&&el.getAttribute?el.getAttribute('data-disc'):'';
  try{window.parent.postMessage({type:'jumia_voucher',code:code,discount:disc},'*');}catch(e){}
}

// ── EMAIL GATE MODAL ──────────────────────────────────────────
// Shared prompt shown when user tries to access leaderboard/vouchers without email
function _showEmailGate(title, subtitle, icon, onSuccess){
  var old=document.getElementById('email-gate-modal');if(old)old.remove();
  var modal=document.createElement('div');
  modal.id='email-gate-modal';
  modal.style.cssText='position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:tierUpIn .2s ease;';
  modal.innerHTML=
    '<div style="background:#fff;border-radius:16px 16px 0 0;padding:24px clamp(20px,5vw,28px) 32px;width:100%;max-width:480px;box-sizing:border-box;">'+
      '<div style="text-align:center;margin-bottom:16px;">'+
        '<div style="font-size:32px;margin-bottom:8px;">'+icon+'</div>'+
        '<div style="font-size:clamp(16px,4.5vw,20px);font-weight:900;color:#403b3b;font-family:var(--H1);text-transform:uppercase;margin-bottom:4px;">'+title+'</div>'+
        '<div style="font-size:clamp(11px,2.8vw,13px);color:#777777;font-family:var(--H2);line-height:1.5;">'+subtitle+'</div>'+
      '</div>'+
      '<div style="position:relative;margin-bottom:6px;">'+
        '<input id="gate-email-inp" type="email" inputmode="email" placeholder="ton@email.com" autocomplete="email"'+
          ' style="width:100%;border:2px solid #E4E4E6;border-radius:8px;padding:12px 14px;font-size:16px;font-family:var(--H2);color:#403b3b;background:#F8F8F8;outline:none;box-sizing:border-box;-webkit-appearance:none;">'+
      '</div>'+
      '<div id="gate-email-err" style="font-size:11px;color:#ec2326;font-family:var(--H2);margin-bottom:6px;min-height:14px;"></div>'+
      '<button id="gate-email-btn" style="width:100%;background:#ff9900;color:#fff;border:none;border-radius:8px;padding:14px;font-size:clamp(13px,3.5vw,15px);font-weight:900;font-family:var(--H1);text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent;margin-bottom:6px;">'+
        '<span id="gate-email-label">CONTINUER</span>'+
        '<div id="gate-email-spinner" style="display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto;"></div>'+
      '</button>'+
      '<button onclick="document.getElementById(\'email-gate-modal\').remove()" style="width:100%;background:none;border:none;color:#777777;font-size:13px;font-family:var(--H2);cursor:pointer;padding:6px;">Annuler</button>'+
    '</div>';

  document.body.appendChild(modal);
  // Wire VKB on the input
  if(window._vkbWire) setTimeout(window._vkbWire, 50);

  // Pre-fill if email known
  var inp=document.getElementById('gate-email-inp');
  if(inp && playerEmail){ inp.value=playerEmail; inp.style.borderColor='#27ae60'; }

  // Submit handler
  function _gateSubmit(){
    var inp=document.getElementById('gate-email-inp');
    var err=document.getElementById('gate-email-err');
    var btn=document.getElementById('gate-email-btn');
    var lbl=document.getElementById('gate-email-label');
    var spn=document.getElementById('gate-email-spinner');
    if(!inp)return;
    var email=inp.value.trim().toLowerCase();
    var emailRe=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if(!emailRe.test(email)){
      if(err)err.textContent='Adresse e-mail invalide.';
      inp.style.borderColor='#ec2326';
      return;
    }
    if(err)err.textContent='';
    if(btn)btn.disabled=true;
    if(lbl)lbl.style.display='none';
    if(spn)spn.style.display='block';

    // Lookup sheet
    playerEmail=email;
    fetchPlayerScore(email).then(function(result){
      if(result&&result.score>0){
        // Known player — restore session
        playerName=result.name||'';
        playerLastName=result.lastName||'';
        bestScore=result.score;
        earnedVouchers=vouchersFromScore(result.score);
        hasPlayedOnce=true;
        saveSession();
      }
      // Either way: save email and proceed
      saveSession();
      var m=document.getElementById('email-gate-modal');if(m)m.remove();
      onSuccess();
    }).catch(function(){
      saveSession();
      var m=document.getElementById('email-gate-modal');if(m)m.remove();
      onSuccess();
    });
  }

  var btn=document.getElementById('gate-email-btn');
  if(btn){
    btn.addEventListener('touchend',function(e){
      e.preventDefault();e.stopPropagation();
      if(window._vkbClose)window._vkbClose();
      setTimeout(_gateSubmit,60);
    },{passive:false});
    btn.addEventListener('click',function(){
      if(window._vkbClose)window._vkbClose();
      setTimeout(_gateSubmit,60);
    });
  }
  // Close on backdrop tap
  modal.addEventListener('touchend',function(e){if(e.target===modal)modal.remove();},{passive:true});
}

// Leaderboard gate
function goToLeaderboardGated(){
  if(playerEmail){ goTo(renderLeaderboard); return; }
  _showEmailGate(
    'Vois ton rang',
    'Entre ton e-mail pour voir ta position dans le classement et te comparer aux autres joueurs.',
    IC.trophy,
    function(){ goTo(renderLeaderboard); }
  );
}

// Vouchers gate
function goToVouchersGated(){
  if(playerEmail){ goTo(renderMyVouchers); return; }
  _showEmailGate(
    'Récupère tes bons',
    'Entre ton e-mail pour retrouver tes bons de réduction et les utiliser sur Jumia.',
    IC.ticket,
    function(){ goTo(renderMyVouchers); }
  );
}

  var earned={};

  var tierDisplay = TIERS.map(function(t, i){
    var directlyEarned = !!earned[t.code];
    var cascaded = !directlyEarned && bestTierIdx !== -1 && i > bestTierIdx;
    var unlocked = directlyEarned || cascaded;
    return {
      disc:t.disc, code:t.code, label:t.label, pts:t.pts,
      min: t.min,   // always show the real minimum — cascade doesn't remove it
      unlocked:unlocked, cascaded:cascaded, directlyEarned:directlyEarned,

  // Wire REJOUER
  var rb=document.getElementById('mv-btn-replay');
  if(rb)rb.addEventListener('pointerdown',function(){goTo(startGame);});
  var hr=document.getElementById('mv-hero-replay');
  if(hr)hr.addEventListener('click',function(){goTo(startGame);});

  // Wire copy buttons via data-code
  document.querySelectorAll('.mv-copy-btn').forEach(function(btn){
    btn.addEventListener('click',function(){copyCode(this.dataset.code,this);});
  });

  // Wire use/CTA buttons via data attributes
  document.querySelectorAll('.mv-use-btn').forEach(function(el){
    el.addEventListener('click',function(e){
      e.preventDefault();
      _sendVoucher(this);
      var url=this.getAttribute('href')||FELICITATIONS_URL;
      // Voucher destination (Adjust tracking link, which redirects into the app)
      // must navigate the top-level location — a _blank popup can be blocked in a
      // WebView and would break the Adjust click → deeplink handoff.
      try{
        if(window.top){window.top.location.href=url;}else{window.location.href=url;}
      }catch(err){
        // Sandboxed iframe: ask the native host to open it, then best-effort fallback.
        try{window.parent.postMessage({type:'jumia_open_url',url:url},'*');}catch(e2){}
        try{window.location.href=url;}catch(e3){}
      }
    });
  });

  // Start expiry countdowns
  setTimeout(startExpiryCountdowns, 100);

  // Sync carousel dots with scroll position
  (function(){
    var track=document.getElementById('vc-track');
    var dotsWrap=document.getElementById('vc-dots');
    if(!track||!dotsWrap)return;
    var dots=dotsWrap.querySelectorAll('.vc-dot');
    var slides=track.querySelectorAll('.vc-slide');
    function slideStep(){
      if(slides.length>1){return slides[1].offsetLeft-slides[0].offsetLeft;}
      return slides.length?slides[0].offsetWidth:track.clientWidth;
    }
    var _raf;
    track.addEventListener('scroll',function(){
      if(_raf)cancelAnimationFrame(_raf);
      _raf=requestAnimationFrame(function(){
        var step=slideStep()||1;
        var idx=Math.round(track.scrollLeft/step);
        idx=Math.max(0,Math.min(dots.length-1,idx));
        dots.forEach(function(d,i){d.classList.toggle('active',i===idx);});
      });
    },{passive:true});
    dots.forEach(function(d,i){
      d.style.cursor='pointer';
      d.addEventListener('click',function(){
        if(slides[i]){slides[i].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}
      });
    });
  })();

  // Show new record burst if applicable

      if(lbdBtnEl)lbdBtnEl.innerHTML=IC.trophy+' TU ES #1 — VOIR LE CLASSEMENT';
    } else if(myRank===2){
      var gap=players[0].score-myScore;
      html='<div style="background:#fff8ee;border:1.5px solid #ff9900;border-radius:10px;padding:clamp(10px,2.5vw,12px) clamp(12px,3vw,16px);margin-bottom:12px;text-align:center;"><div style="font-size:clamp(11px,2.8vw,13px);font-weight:900;color:#403b3b;font-family:var(--H1);">TU ES 2ÈME !</div><div style="font-size:clamp(10px,2.5vw,11px);color:#e68800;font-family:var(--H2);font-weight:700;margin-top:2px;">À <b>'+Number(gap).toLocaleString('fr-FR')+' pts</b> du 1er — rejoue !</div></div>';
      if(lbdBtnEl)lbdBtnEl.innerHTML=IC.trophy+' #2 — À '+Number(gap).toLocaleString('fr-FR')+' pts du 1er';
    } else if(myRank===3){
      var gap=players[1].score-myScore;
      html='<div style="background:#fff8ee;border:1.5px solid #ff9900;border-radius:10px;padding:clamp(10px,2.5vw,12px) clamp(12px,3vw,16px);margin-bottom:12px;text-align:center;"><div style="font-size:clamp(11px,2.8vw,13px);font-weight:900;color:#403b3b;font-family:var(--H1);">TU ES 3ÈME !</div><div style="font-size:clamp(10px,2.5vw,11px);color:#e68800;font-family:var(--H2);font-weight:700;margin-top:2px;">À <b>'+Number(gap).toLocaleString('fr-FR')+' pts</b> de la 2ème place !</div></div>';

      if(gap3>0){
        html='<div style="background:#fff8ee;border:1.5px solid rgba(255,153,0,.5);border-radius:10px;padding:clamp(10px,2.5vw,12px) clamp(12px,3vw,16px);margin-bottom:12px;text-align:center;"><div style="font-size:clamp(11px,2.8vw,13px);font-weight:900;color:#403b3b;font-family:var(--H1);">À <b style="color:#ff9900;">'+Number(gap3).toLocaleString('fr-FR')+' pts</b> de la 3ème place</div><div style="font-size:clamp(10px,2.5vw,11px);color:#777777;font-family:var(--H2);font-weight:700;margin-top:2px;">Rejoue pour entrer dans le Top 3 !</div></div>';
        if(lbdBtnEl)lbdBtnEl.innerHTML=IC.trophy+' TOP 3 À '+Number(gap3).toLocaleString('fr-FR')+' pts — CLASSEMENT';

async function doLobbyLogin(){
  var inp=document.getElementById('lobby-login-email');
  var btn=document.getElementById('lobby-login-btn');
  var lbl=document.getElementById('lobby-login-label');
  var spn=document.getElementById('lobby-login-spinner');
  var msg=document.getElementById('lobby-login-msg');
  if(!inp)return;
  inp.removeAttribute('readonly'); // VKB sets readonly — remove before reading
  var email=inp.value.trim().toLowerCase();
  var emailRe=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if(!emailRe.test(email)){
    inp.style.borderColor='#ec2326';
    if(msg){msg.style.color='#ec2326';msg.textContent='Adresse e-mail invalide.';}
    return;
  }

  // Show spinner
  if(btn)btn.disabled=true;
  if(lbl)lbl.style.display='none';
  if(spn)spn.style.display='block';
  if(msg){msg.style.color='#777777';msg.textContent='Recherche en cours...';}

  var result=await fetchPlayerScore(email);

  if(result&&result.score>0){
    // Found — restore session and go straight to vouchers
    playerEmail=email;
    playerName=result.name||'';
    playerLastName=result.lastName||'';
    bestScore=result.score;
    earnedVouchers=vouchersFromScore(result.score);
    hasPlayedOnce=true;
    saveSession();
    goTo(function(){renderMyVouchers(false);});
  } else {
    // Not found — pre-fill email, show message, auto-redirect to lobby to play
    playerEmail=email;
    if(btn)btn.disabled=false;
    if(lbl)lbl.style.display='block';
    if(spn)spn.style.display='none';
    if(msg){msg.style.color='#e68800';msg.textContent='Aucun bon trouvé — joue pour en gagner !';}
    setTimeout(function(){goTo(renderLobby);},1500);
  }
}

function doLogout(){
  clearSession();
  goTo(renderLobby);
}

// ── ATTEMPTS MIDNIGHT COUNTDOWN ──────────────────────────────
function startAttemptsCountdown(){
  var el=document.getElementById('attempts-countdown');
  if(!el)return;
  function update(){
    var now=new Date();
    var midnight=new Date(now);
    midnight.setHours(24,0,0,0);
    var diff=Math.max(0,midnight-now);
    var h=Math.floor(diff/3600000);
    var m=Math.floor((diff%3600000)/60000);
    var s=Math.floor((diff%60000)/1000);
    var str='Tes essais reviennent dans '+
      String(h).padStart(2,'0')+'h '+
      String(m).padStart(2,'0')+'m '+
      String(s).padStart(2,'0')+'s';
    var el2=document.getElementById('attempts-countdown');
    if(el2){el2.textContent=str;}else{clearInterval(_attTimer);}
  }
  update();
  var _attTimer=setInterval(update,1000);
}

// ── VOUCHER EXPIRY COUNTDOWN (midnight same day) ─────────────
function startExpiryCountdowns(){
  var spans=document.querySelectorAll('[id^="expiry-"]');
  if(!spans.length)return;
  var endDate=new Date(2026,5,15,0,0,0); // June 15, 2026 at 12:00 AM (midnight)
  function update(){
    var now=new Date();
    var diff=Math.max(0,endDate-now);
    var d=Math.floor(diff/86400000);
    var h=Math.floor((diff%86400000)/3600000);
    var m=Math.floor((diff%3600000)/60000);
    var s=Math.floor((diff%60000)/1000);
    var str=(d>0?String(d)+'j ':'')+String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'m '+String(s).padStart(2,'0')+'s';
    document.querySelectorAll('[id^="expiry-"]').forEach(function(sp){sp.textContent=str;});
  }
  update();
  var _expTimer=setInterval(update,1000);
}

function preloadAssets(){
  const images=[IMG_GLOVES,IMG_SOCCER,IMG_GOLDEN,IMG_REDCARD,
    "https://raw.githubusercontent.com/Madzack69/Icons/main/TERRAIN.webp"];
  const bar=$('loading-bar'),gl=$('loading-gloves');
  if(gl)gl.src=IMG_GLOVES;
  const total=images.length;let loaded=0,finished=false;
  function tickLoad(){
    loaded++;
    if(bar)bar.style.width=Math.round((loaded/total)*100)+'%';
    if(loaded>=total&&!finished)finish();
  }
  function finish(){
    finished=true;if(bar)bar.style.width='100%';
    setTimeout(()=>{requestAnimationFrame(()=>{const s=$('loading-screen');if(s)s.classList.add('fade-out');setTimeout(()=>{
      const s2=$('loading-screen');if(s2)s2.remove();
      routeAfterLoad();
    },420);});},350);
  }
  images.forEach(src=>{const i=new Image();i.onload=tickLoad;i.onerror=tickLoad;i.src=src;});
  // Music is lazy — don't load at startup, saves memory on low-RAM devices
  // Tick load count accounts for this
  setTimeout(()=>{if(!finished)finish();},5000);
}

function routeAfterLoad(){
  // ── SESSION RESTORE ──────────────────────────────────────
  const saved=loadSession();
  const todayStr=new Date().toISOString().slice(0,10);
  if(saved&&saved.email){
    playerEmail=saved.email||'';
    playerName=saved.name||'';
    playerLastName=saved.lastName||'';
    playerPhone=saved.phone||'';
    playerCity=saved.city||'';
    bestScore=saved.bestScore||0;
    earnedVouchers=saved.earnedVouchers||[];
    if(bestScore>0)hasPlayedOnce=true;
    if(saved.attemptsDate===todayStr && typeof saved.attempts==='number'){attempts=saved.attempts;}
    else{attempts=4;saveSession();}
  } else { attempts=4; }
  // ── DEEP-LINK (design showcase) ──────────────────────────
  var _qp;try{_qp=new URLSearchParams(location.search);}catch(e){_qp=null;}
  var _scr=_qp&&_qp.get('screen');
  var _hero=_qp&&_qp.get('hero');
  if(_hero){window.LOBBY_HERO=_hero;try{localStorage.setItem('jg_hero',_hero);}catch(e){}}
  if(_scr){
    var _seed=parseInt((_qp.get('seed')||'0'),10)||0;
    if(_scr==='result'){
      scoreVal=_seed;maxComboVal=3;elapsedSec=Math.round(_seed/30);hasPlayedOnce=true;
      if(_seed>bestScore)bestScore=_seed;earnedVouchers=vouchersFromScore(_seed);
      renderResult();return;
    }
    if(_scr==='vouchers'){
      scoreVal=_seed;maxComboVal=3;elapsedSec=Math.round(_seed/30);hasPlayedOnce=true;
      bestScore=Math.max(bestScore,_seed);playerEmail=playerEmail||'demo@jumia.ma';playerName=playerName||'Yasmine';
      earnedVouchers=vouchersFromScore(_seed);renderMyVouchers(true);return;
    }
  }
  // ── COMPETITION WINDOW GATE ──────────────────────────────
  if(!isLive()){ renderLockScreen(); return; }
  renderLobby();
}

// ── BOOT ─────────────────────────────────────────────────
(function(){
  var qp;try{qp=new URLSearchParams(location.search);}catch(e){qp=null;}
  if(qp && (qp.get('screen')||qp.get('hero'))){
    window._showcase=true;
    var ls=document.getElementById('loading-screen');if(ls)ls.remove();
    var rs=document.getElementById('rotate-screen');if(rs)rs.classList.remove('show');
    routeAfterLoad();
  } else {
    preloadAssets();
  }
})();
