<style>
@font-face{font-family:'HelveticaDisplay';src:url('https://raw.githubusercontent.com/Madzack69/Fonts/main/helvetica-compressed-5871d14b6903a.otf') format('opentype');font-weight:900;font-display:swap;}
@font-face{font-family:'HelveticaText';src:url('https://raw.githubusercontent.com/Madzack69/Fonts/main/Helvetica-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
@font-face{font-family:'HelveticaText';src:url('https://raw.githubusercontent.com/Madzack69/Fonts/main/Helvetica.ttf') format('truetype');font-weight:500;font-display:swap;}
@font-face{font-family:'Gotham';src:url('https://raw.githubusercontent.com/Madzack69/Fonts/main/Gotham-Black.otf') format('opentype');font-weight:900;font-display:swap;}

:root{
  --bg:      #F1F1F2;
  --card:    #ffffff;
  --border:  #E4E4E6;
  --navy:    #403b3b;
  --grey:    #777777;
  --greyL:   #D0D0D6;
  --orange:  #ff9900;
  --orangeD: #e68800;
  --yellow:  #ffba00;
  --red:     #ec2326;
  --redD:    #a31a1d;
  --white:   #ffffff;
  --dark:    #403b3b;
  --panel:   #ffffff;
  --blue:    #403b3b;
  --blueD:   #111827;
  --tintWarm:#fff8ee;
  --H1: 'HelveticaDisplay','Arial Black',Arial,sans-serif;
  --H2: 'HelveticaText','Arial',sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#F1F1F2;overscroll-behavior:none;touch-action:pan-y;-webkit-overflow-scrolling:touch;}
/* Allow WebView keyboard to open on input focus */
input,textarea,select{touch-action:auto;-webkit-user-select:text;user-select:text;}
body{display:flex;align-items:stretch;justify-content:center;-webkit-user-select:none;user-select:none;background:#F1F1F2;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:#F1F1F2;overflow:hidden;font-family:var(--H1);position:relative;touch-action:pan-y;}

@keyframes fadeIn{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-60px) scale(.8)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes bigShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
@keyframes screenFlash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
@keyframes itemIn{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
@keyframes goldenSpin{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
@keyframes dangerPulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wipeIn{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes ctaBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes tierUpIn{0%{opacity:0;transform:scale(.7)}60%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes tapRing{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
@keyframes hintLeft{0%,100%{transform:translateX(0);opacity:.6}50%{transform:translateX(-7px);opacity:1}}
@keyframes hintRight{0%,100%{transform:translateX(0);opacity:.6}50%{transform:translateX(7px);opacity:1}}

#loading-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:#F1F1F2;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .4s;}
#loading-screen.fade-out{opacity:0;pointer-events:none;}
.loading-logo{font-size:clamp(38px,12vw,54px);font-weight:900;color:#403b3b;font-family:var(--H1);line-height:.9;text-align:center;text-transform:uppercase;letter-spacing:-.01em;}
.loading-sub{font-size:clamp(10px,2.8vw,12px);color:#777777;font-family:var(--H2);font-weight:700;text-transform:uppercase;letter-spacing:.08em;}
.loading-bar-wrap{width:clamp(160px,45vw,220px);height:4px;background:#E4E4E6;border-radius:2px;overflow:hidden;}
.loading-bar{height:100%;width:0%;background:#ff9900;border-radius:2px;transition:width .25s ease;}
.loading-gloves{height:clamp(52px,14vw,68px);width:auto;filter:drop-shadow(0 3px 8px rgba(30,41,59,.2));}

#rotate-screen{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#F1F1F2;z-index:99998;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
#rotate-screen.show{display:flex;}
.rotate-msg{font-size:clamp(16px,5vw,20px);font-weight:900;color:var(--white);font-family:var(--H1);text-align:center;}
@media (orientation:landscape) and (max-height:500px){body{display:none;}}

#play-transition{position:fixed;top:0;left:0;right:0;bottom:0;background:#ff9900;z-index:9999;pointer-events:none;transform:scaleY(0);transform-origin:bottom;}
#play-transition.go{animation:wipeIn .45s cubic-bezier(.76,0,.24,1) forwards;}

#screen-game{flex:1;display:flex;flex-direction:column;overflow:hidden;animation:fadeIn .15s ease;}
.gm-hud{flex:0 0 auto;background:var(--orange);padding:clamp(8px,2vw,12px) clamp(14px,4vw,22px);display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--orangeD);}
.gm-title{font-size:clamp(16px,4.5vw,22px);font-weight:900;color:#ffffff;font-family:var(--H1);text-transform:uppercase;line-height:1;}
.gm-title span{color:rgba(255,255,255,.86);}
.combo-badge{background:#ff9900;color:#ffffff;border-radius:6px;padding:3px 10px;font-size:clamp(10px,2.6vw,12px);font-weight:900;display:none;font-family:var(--H1);white-space:nowrap;pointer-events:none;margin-left:auto;}

#game-field{flex:1;position:relative;overflow:hidden;touch-action:none;-ms-touch-action:none;background-color:#3a7d3a;background-image:url('https://raw.githubusercontent.com/Madzack69/Icons/main/GAME_BG.gif'),url('https://raw.githubusercontent.com/Madzack69/Icons/main/TERRAIN.webp');background-position:center,center;background-size:cover,cover;background-repeat:no-repeat,no-repeat;}

#game-overlay{position:absolute;top:clamp(10px,2.5vw,14px);right:clamp(10px,2.5vw,14px);display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vw,12px);z-index:8;}
.score-circle{width:clamp(60px,15vw,74px);height:clamp(60px,15vw,74px);background:#ffffff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(255,255,255,.8),0 4px 16px rgba(0,0,0,.25);flex-shrink:0;}
.score-num{font-size:clamp(17px,5vw,22px);font-weight:900;color:#403b3b;line-height:1;font-family:var(--H1);}
.score-lbl{font-size:9px;font-weight:700;color:#777777;font-family:var(--H2);letter-spacing:.06em;text-transform:uppercase;}
#lives-counter{display:none;} /* hidden — replaced by #lives-hearts below */

/* Hearts above gloves — small, semi-transparent, non-blocking */
#lives-hearts{
  position:absolute;
  bottom:calc(clamp(62px,16vw,82px) + clamp(10px,2.5vw,14px)); /* glove height + gap */
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:clamp(4px,1.2vw,7px);
  z-index:7;
  pointer-events:none;
  opacity:0.75; /* semi-transparent — items visible through/around it */
  transition:opacity .3s;
}
/* Flash to full opacity when a life is lost */
#lives-hearts.flash{opacity:1;}
.lives-heart-icon{
  font-size:clamp(16px,4.5vw,22px);
  line-height:1;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));
  transition:transform .15s,opacity .3s;
  display:block;
}
.lives-heart-icon.lost{
  opacity:0.2;
  transform:scale(.8);
  filter:grayscale(1) drop-shadow(0 1px 3px rgba(0,0,0,.4));
}

#goal-zone{position:absolute;bottom:0;left:0;right:0;height:clamp(120px,30vw,150px);pointer-events:none;z-index:2;border-top:2px solid rgba(255,255,255,.2);}
#goal-zone::before{content:'';position:absolute;top:-1px;left:12%;right:12%;height:2px;background:rgba(255,255,255,.35);border-radius:1px;}
#goal-posts{position:absolute;top:-10px;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);display:flex;align-items:flex-end;gap:clamp(56px,16vw,84px);}
.goal-post{width:4px;height:clamp(18px,5vw,24px);background:rgba(255,255,255,.45);border-radius:2px 2px 0 0;}

.falling-item{position:absolute;display:flex;align-items:center;justify-content:center;animation:itemIn .15s ease;z-index:5;pointer-events:none;user-select:none;-webkit-user-select:none;}
.falling-item img{pointer-events:none;-webkit-user-drag:none;user-select:none;}
.item-ball{width:clamp(42px,11vw,56px);height:clamp(42px,11vw,56px);filter:drop-shadow(0 3px 6px rgba(0,0,0,.7)) drop-shadow(0 0 2px rgba(0,0,0,.5));}
.item-ball img{width:100%;height:100%;object-fit:contain;border-radius:50%;}
.item-ball.danger-close{filter:drop-shadow(0 0 10px rgba(255,255,255,.9)) drop-shadow(0 4px 8px rgba(0,0,0,.3));animation:dangerPulse .35s ease infinite;}
.item-golden{width:clamp(42px,11vw,56px);height:clamp(42px,11vw,56px);filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));animation:goldenSpin 1.2s linear infinite,itemIn .15s ease;}
.item-golden img{width:100%;height:100%;object-fit:contain;border-radius:50%;}
.item-redcard{width:clamp(58px,15vw,76px);height:clamp(76px,20vw,100px);filter:drop-shadow(0 2px 8px rgba(0,0,0,.6));}
.item-redcard img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none;}
.item-redcard.danger-close{filter:drop-shadow(0 0 10px rgba(255,140,0,.7)) drop-shadow(0 2px 8px rgba(0,0,0,.5));animation:dangerPulse .35s ease infinite;}

#glove-el{position:absolute;z-index:6;left:0;width:90px;display:flex;align-items:center;justify-content:center;will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden;-webkit-transform:translate3d(0,0,0);transform:translate3d(0,0,0);contain:layout style;}
#glove-shake{display:flex;align-items:center;justify-content:center;width:90px;}
#glove-el img{display:block;height:clamp(62px,16vw,82px);width:90px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(255,153,0,.5)) drop-shadow(0 6px 12px rgba(0,0,0,.5));-webkit-backface-visibility:hidden;backface-visibility:hidden;will-change:filter;}
#glove-el.catching img{filter:drop-shadow(0 0 16px rgba(255,255,255,.9)) drop-shadow(0 0 28px rgba(255,200,0,.7));}
#glove-shake.big-shake{-webkit-animation:bigShake .5s ease;animation:bigShake .5s ease;}

#catch-ring{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.8);opacity:0;pointer-events:none;z-index:7;transform:scale(0);transition:transform .3s,opacity .3s;}
#catch-ring.pop{opacity:1;-webkit-transform:scale(1.6);transform:scale(1.6);}

.flash-msg{position:absolute;border-radius:20px;padding:4px 13px;font-size:clamp(12px,3.2vw,15px);font-weight:900;pointer-events:none;animation:floatUp 1.1s ease forwards;z-index:10;white-space:nowrap;font-family:var(--H1);}

#danger-bar{position:absolute;bottom:0;left:0;right:0;height:0;background:var(--red);transition:height .15s,opacity .15s;opacity:0;z-index:3;}
#dodge-hint{position:absolute;left:50%;transform:translateX(-50%);background:rgba(236,35,38,.92);color:#fff;border-radius:20px;padding:4px 14px;font-size:11px;font-weight:900;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;z-index:8;font-family:var(--H2);}

#screen-game.hit-flash::after{
  content:'';
  position:absolute;inset:0;z-index:50;
  background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.55) 100%);
  animation:screenFlash .45s ease forwards;
  pointer-events:none;
}

#btn-mute{position:absolute;bottom:clamp(10px,2.5vw,14px);left:clamp(10px,2.5vw,14px);width:clamp(44px,9vw,46px);height:clamp(44px,9vw,46px);border-radius:50%;background:rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.2);cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;z-index:9;touch-action:manipulation;}

#btn-cashout{position:absolute;top:clamp(10px,2.5vw,14px);left:clamp(10px,2.5vw,14px);min-height:44px;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.25);color:rgba(255,255,255,.8);border-radius:8px;padding:10px 14px;font-size:clamp(10px,2.5vw,11px);font-weight:700;font-family:var(--H2);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;z-index:9;touch-action:manipulation;display:flex;align-items:center;gap:6px;}
#btn-cashout.confirm-mode{background:#ff9900;color:#ffffff;border-color:#e68800;}

#touch-hint{position:absolute;top:0;left:0;right:0;bottom:0;z-index:20;pointer-events:none;display:flex;align-items:stretch;opacity:1;transition:opacity .5s;}
#touch-hint.hidden{opacity:0;}
.touch-zone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.5vw,14px);padding:16px 8px;}
.touch-zone-left{background:rgba(0,0,0,.38);border-right:1px solid rgba(255,255,255,.1);}
.touch-zone-right{background:rgba(0,0,0,.38);}
.touch-zone-label{font-size:clamp(12px,3vw,15px);font-weight:900;font-family:var(--H1);color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.08em;text-align:center;}
.touch-zone-sub{font-size:clamp(9px,2.3vw,11px);font-weight:700;font-family:var(--H2);color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.06em;text-align:center;}
#touch-flash-left,#touch-flash-right{position:absolute;top:0;bottom:0;width:clamp(44px,11vw,60px);z-index:9;pointer-events:none;opacity:0;transition:opacity .08s;}
#touch-flash-left{left:0;background:linear-gradient(90deg,rgba(255,153,0,.3) 0%,transparent 100%);}
#touch-flash-right{right:0;background:linear-gradient(270deg,rgba(255,153,0,.3) 0%,transparent 100%);}
#touch-flash-left.active,#touch-flash-right.active{opacity:1;}

#screen-tutorial{position:fixed;top:0;left:0;right:0;bottom:0;background:#F1F1F2;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(24px,6vw,40px) clamp(20px,5vw,28px);animation:fadeIn .3s ease;gap:clamp(10px,2.5vw,14px);}
.tuto-title{font-size:clamp(22px,6.5vw,30px);font-weight:900;color:#403b3b;font-family:var(--H1);text-transform:uppercase;text-align:center;line-height:.93;}
.tuto-title span{color:#ff9900;}
.tuto-sub{font-size:clamp(12px,3vw,14px);color:#777777;font-family:var(--H2);text-align:center;margin-bottom:6px;}
.tuto-rules{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;}
.tuto-rule{display:flex;align-items:center;gap:14px;background:#ffffff;border:1px solid #E4E4E6;border-radius:12px;padding:clamp(14px,3.5vw,18px);}
.tuto-rule-icon{width:clamp(44px,11vw,54px);height:clamp(44px,11vw,54px);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tuto-rule-icon.catch{background:rgba(255,153,0,.1);border:2px solid rgba(255,153,0,.3);}
.tuto-rule-icon.dodge{background:rgba(236,35,38,.12);border:2px solid rgba(236,35,38,.3);}
.tuto-rule-icon img{width:clamp(26px,7vw,32px);height:clamp(26px,7vw,32px);object-fit:contain;}
.tuto-rule-text{flex:1;}
.tuto-rule-title{font-size:clamp(13px,3.5vw,15px);font-weight:900;color:#403b3b;font-family:var(--H1);text-transform:uppercase;margin-bottom:3px;}
.tuto-rule-sub{font-size:clamp(10px,2.6vw,12px);color:#777777;font-family:var(--H2);}
.tuto-rule-badge{font-size:clamp(10px,2.6vw,11px);font-weight:900;font-family:var(--H1);padding:5px 11px;border-radius:6px;text-transform:uppercase;white-space:nowrap;flex-shrink:0;}
.tuto-rule-badge.orange{background:#ff9900;color:#ffffff;}
.tuto-rule-badge.red{background:var(--red);color:var(--white);}
.tuto-screen-btn{width:100%;max-width:340px;background:#ff9900;color:#ffffff;border:none;border-radius:12px;padding:clamp(18px,5vw,22px);font-size:clamp(17px,4.8vw,21px);font-weight:900;font-family:var(--H1);text-transform:uppercase;letter-spacing:.06em;cursor:pointer;box-shadow:0 4px 0 #e68800;transition:transform .1s,box-shadow .1s;margin-top:6px;}
.tuto-screen-btn:active{transform:translateY(4px);box-shadow:0 0 0 #e68800;}

#screen-form{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;animation:fadeIn .25s ease;}
.fm-top{flex:0 0 auto;background:#ff9900;padding:clamp(10px,2.5vw,14px) clamp(16px,4vw,22px) clamp(10px,2.5vw,14px);text-align:center;position:relative;}
.fm-back{position:absolute;left:clamp(10px,3vw,16px);top:clamp(10px,3vw,15px);width:36px;height:36px;border-radius:9999px;border:none;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:3;transition:background .15s;}
.fm-back:active{background:rgba(255,255,255,.32);}
.fm-icon{font-size:32px;margin-bottom:6px;}
.fm-title{font-size:clamp(20px,6vw,26px);font-weight:900;color:#ffffff;line-height:.92;font-family:var(--H1);margin-bottom:8px;text-transform:uppercase;}
.fm-sub{font-size:clamp(13px,3.2vw,15px);color:rgba(255,255,255,.75);font-family:var(--H2);font-weight:500;line-height:1.5;}
.fm-sub b{color:#ffffff;font-weight:700;}
.fm-card{flex:0 0 auto;background:#ffffff;border:1px solid #E4E4E6;margin:clamp(8px,2vw,12px) clamp(14px,3.5vw,18px) 0;border-radius:12px;padding:clamp(12px,3vw,16px);}
.fm-field{margin-bottom:clamp(12px,3vw,16px);}
.fm-label{display:block;font-size:clamp(10px,2.6vw,11px);font-weight:700;color:#777777;font-family:var(--H2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.fm-input{width:100%;border:1.5px solid #E4E4E6;border-radius:8px;padding:clamp(8px,2vw,11px) clamp(12px,3vw,15px);font-size:16px;font-family:var(--H2);color:#403b3b;background:#F8F8F8;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;}
.fm-input:focus{border-color:#ff9900;box-shadow:0 0 0 3px rgba(255,153,0,.12);}
.fm-input::placeholder{color:#C0C0C8;}
.fm-input.error{border-color:#ec2326;background:#fff8f8;}
.fm-error-msg{font-size:clamp(10px,2.5vw,11px);color:#ec2326;font-family:var(--H2);font-weight:700;margin-top:4px;display:none;}

/* ── Sponsor strip ── */
.lb-sponsors{
  flex:0 0 auto;
  padding:clamp(8px,2vw,10px) clamp(16px,4vw,22px) 0;
}
.lb-sponsors-title{
  font-size:clamp(8px,2vw,10px);

  font-family:var(--H2);
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:6px;
}
.lb-sponsors-track{
  position:relative;
  overflow:hidden;
  width:100%;
}
.lb-sponsors-track::before,
.lb-sponsors-track::after{
  content:'';position:absolute;top:0;bottom:0;width:24px;z-index:2;pointer-events:none;
}
.lb-sponsors-track::before{left:0;background:linear-gradient(90deg,#F1F1F2,transparent);}
.lb-sponsors-track::after{right:0;background:linear-gradient(270deg,#F1F1F2,transparent);}
.lb-sponsors-inner{
  display:flex;
  gap:10px;
  width:max-content;
  /* CSS infinite marquee — animates exactly one set width, loops perfectly */
  animation:marqueeScroll 18s linear infinite;
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
}
.lb-sponsors-inner:hover,
.lb-sponsors-inner.paused{
  animation-play-state:paused;
}
/* translate by exactly 50% = one full set of logos (inner has 2 identical sets) */
@keyframes marqueeScroll{
  0%  {transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

/* ── VIRTUAL KEYBOARD — Android Material style ─────────────── */
#vkb-overlay{position:fixed;inset:0;z-index:9998;display:none;background:transparent;}
#vkb{
  position:fixed;bottom:0;left:0;right:0;z-index:9999;
  background:#EEF0F3;
  padding:clamp(3px,1vw,6px) clamp(2px,0.6vw,4px) clamp(6px,2vw,12px);
  padding-bottom:calc(clamp(6px,2vw,12px) + env(safe-area-inset-bottom,0px));
  transform:translateY(100%) translateZ(0);
  transition:transform .18s cubic-bezier(.4,0,.2,1);
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
  width:100%;box-sizing:border-box;
  will-change:transform;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  box-shadow:0 -1px 0 rgba(0,0,0,.12);
}
#vkb.vkb-show{transform:translateY(0) translateZ(0);}

  background:#ffffff;

/* Key rows */
.vkb-row{
  display:flex;
  justify-content:center;
  gap:clamp(4px,1vw,7px);
  margin-bottom:clamp(4px,1vw,7px);
  padding:0 clamp(2px,0.6vw,4px);
}

/* Regular letter keys — Android white rounded */
.vkb-k{
  height:clamp(40px,11.5vw,50px);
  min-width:0;flex:1;
  max-width:clamp(30px,9.5vw,44px);
  background:#ffffff;
  border:none;
  border-radius:4px;
  box-shadow:0 1px 0 1px #B0B3BA;
  font-size:clamp(14px,4.2vw,18px);
  font-weight:400;
  color:#202124;
  font-family:Roboto,system-ui,-apple-system,sans-serif;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  flex-shrink:0;box-sizing:border-box;
  will-change:background;
  -webkit-user-select:none;user-select:none;
  position:relative;
}
/* Android key popup on press */
.vkb-k:active{background:#D4D7DC;}

/* Dark/action keys (shift, backspace, 123, abc) */
.vkb-k.dark{
  background:#C8CBD0;
  box-shadow:0 1px 0 1px #9EA2A9;
  font-size:clamp(11px,3.2vw,14px);
  color:#202124;
  max-width:clamp(36px,11vw,54px);
}
.vkb-k.dark:active{background:#B0B3BA;}
.vkb-k.wide{max-width:clamp(40px,12vw,60px);}

/* Space bar */
.vkb-k.space{
  flex:4;max-width:none;
  font-size:clamp(11px,3vw,13px);
  color:#5F6368;
  letter-spacing:.03em;
}

/* OK / Enter key — orange accent */
.vkb-k.done{
  background:#ff9900;
  color:#ffffff;
  font-weight:700;
  font-size:clamp(11px,3vw,14px);
  max-width:clamp(60px,18vw,90px);

}

/* ── Lobby hero variants ─────────────────────────────────────

#hero-switch{
  position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}

.mv-use-first{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;background:#fff;color:#633185;border-radius:9999px;padding:clamp(12px,3.4vw,15px);margin-top:clamp(10px,2.6vw,12px);font-family:var(--H1);font-weight:900;font-size:clamp(13px,3.7vw,15px);text-transform:uppercase;text-decoration:none;-webkit-tap-highlight-color:transparent;}

.mv-lbd-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;background:#fff;border:1px solid #E4E4E6;border-radius:10px;padding:clamp(12px,3vw,14px);font-size:clamp(12px,3.1vw,14px);font-weight:700;color:#403b3b;cursor:pointer;font-family:var(--H2);text-transform:uppercase;letter-spacing:.03em;margin-top:clamp(14px,3.6vw,18px);-webkit-tap-highlight-color:transparent;}
.mv-lbd-btn svg{width:1.1em;height:1.1em;color:#ff9900;}

/* ── FULL-SCREEN VOUCHER CAROUSEL ──────────────────────────── */
.vc-wrap{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.vc-track{flex:1 1 auto;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x;min-height:0;scroll-padding:0 6%;}
.vc-track::-webkit-scrollbar{display:none;}
.vc-slide{scroll-snap-align:center;flex:0 0 88%;width:88%;box-sizing:border-box;padding:clamp(8px,2.4vw,14px) clamp(6px,1.8vw,10px);display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.vc-slide:first-child{margin-left:6%;}
.vc-slide:last-child{margin-right:6%;}
.vc-card{background:#fff;border:3px solid #ff9900;border-radius:20px;padding:clamp(14px,3.8vw,20px) clamp(14px,3.6vw,20px);box-shadow:0 8px 24px rgba(255,153,0,.16);display:flex;flex-direction:column;margin:auto 0;}
.vc-card.dark{background:#633185;border-color:#633185;box-shadow:0 10px 30px rgba(99,49,133,.28);}
.vc-card.empty{border-color:#E4E4E6;box-shadow:none;text-align:center;}
.vc-tag{align-self:flex-start;background:#ff9900;color:#fff;font-family:var(--H2);font-weight:800;font-size:clamp(10px,2.9vw,13px);text-transform:uppercase;letter-spacing:.05em;border-radius:7px;padding:5px 11px;margin-bottom:clamp(8px,2.4vw,12px);}
.vc-card.dark .vc-tag{background:rgba(255,255,255,.22);}
.vc-disc{font-family:var(--H1);font-weight:900;color:#ff9900;line-height:.85;font-size:clamp(42px,12vw,64px);letter-spacing:-.02em;}
.vc-card.dark .vc-disc{color:#fff;}
.vc-disc small{display:block;font-size:.3em;color:#403b3b;letter-spacing:.05em;margin-top:4px;font-weight:900;}
.vc-card.dark .vc-disc small{color:rgba(255,255,255,.8);}
.vc-min{font-family:var(--H2);font-size:clamp(13px,3.7vw,17px);color:#6a6a6a;margin:clamp(7px,2.2vw,11px) 0 clamp(9px,2.6vw,13px);line-height:1.3;}
.vc-min b{color:#403b3b;font-weight:800;}
.vc-card.dark .vc-min{color:rgba(255,255,255,.82);}
.vc-card.dark .vc-min b{color:#fff;}
.vc-code-row{display:flex;align-items:stretch;gap:8px;}
.vc-code{flex:1;min-width:0;background:#fff8ee;border:2px dashed #ff9900;border-radius:10px;padding:clamp(10px,2.8vw,14px) clamp(6px,2vw,10px);font-family:var(--H1);font-weight:900;color:#403b3b;letter-spacing:.04em;text-align:center;font-size:clamp(16px,4.6vw,22px);white-space:nowrap;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.vc-card.dark .vc-code{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.55);color:#fff;}
.vc-copy{flex-shrink:0;background:#403b3b;color:#fff;border:none;border-radius:10px;padding:0 clamp(14px,4vw,20px);font-family:var(--H1);font-weight:900;font-size:clamp(12px,3.3vw,15px);text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.vc-card.dark .vc-copy{background:#fff;color:#633185;}
.vc-use{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;background:#ff9900;color:#fff;border:none;border-radius:9999px;padding:clamp(11px,3.2vw,15px);margin-top:clamp(9px,2.6vw,13px);font-family:var(--H1);font-weight:900;font-size:clamp(14px,3.9vw,18px);text-transform:uppercase;text-decoration:none;letter-spacing:.02em;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 14px rgba(255,153,0,.3);cursor:pointer;}
.vc-card.dark .vc-use{background:#fff;color:#633185;box-shadow:0 4px 14px rgba(0,0,0,.16);}
.vc-expiry{text-align:center;margin-top:clamp(9px,2.6vw,13px);font-family:var(--H2);font-size:clamp(12px,3.4vw,15px);color:#e68800;font-weight:800;}
.vc-card.dark .vc-expiry{color:rgba(255,255,255,.85);}
.vc-empty-replay{display:inline-flex;align-items:center;justify-content:center;background:#ff9900;color:#fff;border:none;border-radius:9999px;padding:clamp(16px,4.5vw,22px) clamp(26px,7vw,38px);margin-top:clamp(14px,4vw,20px);font-family:var(--H1);font-weight:900;font-size:clamp(17px,4.8vw,22px);text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.vc-dots{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:clamp(10px,2.6vw,14px) 0 clamp(6px,1.6vw,10px);}
.vc-dot{width:9px;height:9px;border-radius:50%;background:#d8d4d4;transition:all .25s ease;}
.vc-dot.active{background:#ff9900;width:26px;border-radius:5px;}
.vc-swipe-hint{flex:0 0 auto;text-align:center;font-family:var(--H2);font-weight:700;font-size:clamp(12px,3.2vw,14px);color:#e68800;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;justify-content:center;gap:6px;padding-bottom:clamp(6px,1.6vw,10px);}
.vc-swipe-hint svg{width:18px;height:18px;animation:swipeNudge 1.5s ease-in-out infinite;}
@media (prefers-reduced-motion: reduce){.vc-swipe-hint svg{animation:none;}}

</style>
</head>

// Bypass the live-window lock for previews / QA via ?live=1, ?screen=…, or ?now=ISO
function _nowMs(){
  try{var q=new URLSearchParams(location.search);var n=q.get('now');if(n){var t=Date.parse(n);if(!isNaN(t))return t;}}catch(e){}
  return Date.now();
}
function _isLockBypassed(){
  if(window.__UNLOCK_GAME===true)return true;
  try{var q=new URLSearchParams(location.search);return q.get('live')==='1'||!!q.get('screen');}catch(e){return false;}
}
// Returns {phase:'live'|'before'|'ended', slot, idx, target}
function getSlotState(){
  var now=_nowMs();
  for(var i=0;i<SLOTS.length;i++){
    if(now<SLOTS[i].start) return {phase:'before',slot:SLOTS[i],idx:i,target:SLOTS[i].start};
    if(now<SLOTS[i].end)   return {phase:'live', slot:SLOTS[i],idx:i,target:SLOTS[i].end};
  }
  return {phase:'ended'};
}
function isLive(){ return _isLockBypassed() || getSlotState().phase==='live'; }

// ── STREAK ────────────────────────────────────────────────────
function checkStreak(){
  var today=new Date().toISOString().slice(0,10);
  var raw=localStorage.getItem('jg_streak');
  var streak=raw?JSON.parse(raw):{days:0,last:'',bonus:false};
  var yesterday=new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(streak.last===yesterday){
    streak.days=Math.min(streak.days+1,7);
  } else if(streak.last!==today){
    streak.days=1;
  }
  streak.last=today;
  // Bonus attempt on day 3, 5, 7
  var bonusDays=[3,5,7];
  if(bonusDays.indexOf(streak.days)>=0&&!streak.bonus){
    streak.bonus=true;
    attempts=Math.min(attempts+1,5); // +1 attempt, max 5
    localStorage.setItem('jg_streak',JSON.stringify(streak));
    return streak.days; // return streak day to show notification
  }
  streak.bonus=false;
  localStorage.setItem('jg_streak',JSON.stringify(streak));
  return 0;
}

async function doLogin(){
  const inp=$('login-email');
  const errEl=$('login-error');
  const btn=$('login-btn');
  const lbl=$('login-btn-label');
  const spn=$('login-spinner');
  if(!inp)return;

  const email=inp.value.trim().toLowerCase();
  const emailRe=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  // Clear error
  if(errEl){errEl.style.display='none';errEl.textContent='';}
  inp.style.borderColor='#E4E4E6';

  if(!emailRe.test(email)){
    inp.style.borderColor='#ec2326';
    if(errEl){errEl.textContent='Entre une adresse e-mail valide.';errEl.style.display='block';}
    return;
  }

  // Show spinner
  if(btn)btn.disabled=true;
  if(lbl)lbl.style.display='none';
  if(spn)spn.style.display='block';

  // Look up score from sheet
  const result=await fetchPlayerScore(email);

  if(result&&result.score>0){
    // Known player — restore their session
    playerEmail=email;
    playerName=result.name||'';
    playerLastName=result.lastName||'';
    bestScore=result.score;
    earnedVouchers=vouchersFromScore(result.score);
    hasPlayedOnce=true;
    saveSession();
    goTo(function(){renderMyVouchers(false);});
  } else {
    // Email not found — treat as new player, pre-fill email for the form
    playerEmail=email;
    if(btn)btn.disabled=false;
    if(lbl)lbl.style.display='block';
    if(spn)spn.style.display='none';
    if(errEl){
      errEl.style.display='block';
      errEl.style.color='#e68800';
      errEl.textContent='Aucun bon trouvé pour cet e-mail. Joue pour en gagner !';
    }
    // After 1.8s auto-redirect to lobby
    setTimeout(()=>goTo(renderLobby),1800);
  }
}

window.dataLayer = window.dataLayer || [];

// Map game events to Jumia's standard event names (from app analytics)
var JM_EVENT_MAP = {
  'game_start':     'screen_view',          // screen_view: 9.5M events — standard page view
  'game_end':       'user_engagement',      // user_engagement: 3.3M — session engagement
  'voucher_copied': 'vouchers_view',        // vouchers_view: 4,821 — closest voucher event
  'sponsor_click':  'select_promotion',     // select_promotion: 190K — ad/promo tap
  'form_submit':    'lead_times_location_click', // not ideal — override below
  'share_leaderboard': 'whatsapp_open',     // whatsapp_open: 2,560 — exact match
  'game_start_purchase_funnel': 'begin_checkout', // for funnel tracking
};

function _track(event, params){
  try{
    // Always push custom jg_ event for game-specific tracking
    window.dataLayer.push(Object.assign({event:'jg_'+event, game:'GardienDeBut'}, params||{}));
    // Also push mapped Jumia standard event for unified analytics
    var mapped = JM_EVENT_MAP[event];
    if(mapped){
      var stdParams = Object.assign({screen_name:'GardienDeBut', game_event:event}, params||{});
      if(event==='game_end') stdParams.engagement_time_msec = (params&&params.survie?params.survie*1000:0);
      if(event==='voucher_copied') stdParams.promotion_id = params&&params.code;
      if(event==='sponsor_click') stdParams.promotion_id = params&&params.brand;
      if(event==='share_leaderboard') stdParams.method = 'whatsapp';
      window.dataLayer.push(Object.assign({event:mapped}, stdParams));
    }
  }catch(e){}
}

(function initVKB(){
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',initVKB);
    return;
  }

  var vkb     = document.getElementById('vkb');
  var vkbKeys = document.getElementById('vkb-keys');
  var vkbText = document.getElementById('vkb-text');
  var vkbOvl  = document.getElementById('vkb-overlay');
  if(!vkb||!vkbKeys||!vkbOvl){console.warn('[VKB] missing elements');return;}

  var activeInput=null, shifted=false, numMode=false;

  // ── AZERTY layout ────────────────────────────────────────────
  var ALPHA=[
    ['a','z','e','r','t','y','u','i','o','p'],
    ['q','s','d','f','g','h','j','k','l','m'],
    ['\u21e7','w','x','c','v','b','n',',','\u232b'],
    ['123','@','.','-','_','espace','OK \u2713']
  ];
  var NUMS=[
    ['1','2','3','4','5','6','7','8','9','0'],
    ['-','_','.','@','!','&','+','=','#','%'],
    ['\u2190','abc','\u2192','espace','\u232b','OK \u2713']
  ];

  function buildKeys(){
    vkbKeys.innerHTML='';
    (numMode?NUMS:ALPHA).forEach(function(row){
      var d=document.createElement('div');
      d.className='vkb-row';
      row.forEach(function(k){
        var b=document.createElement('div');
        b.className='vkb-k';
        var label=k;
        if(k==='espace'){b.className+=' space';label='espace';}
        else if(k==='OK \u2713'){b.className+=' done';}
        else if(k==='\u232b'){b.className+=' dark wide';}
        else if(k==='\u21e7'){b.className+=' dark wide';label=shifted?'\u21e7\u25cf':'\u21e7';}
        else if(k==='\u2190'||k==='\u2192'){b.className+=' dark wide';}  // ← →
        else if(['@','.','-','_','#','!'].indexOf(k)>=0){b.className+=' dark';}
        b.textContent=label;
        b.addEventListener('touchstart',function(e){e.preventDefault();b.style.background='#D4D7DC';b.style.color='#202124';},{passive:false});
        b.addEventListener('touchend',function(e){
          e.preventDefault();e.stopPropagation();
          b.style.background='';b.style.color='';
          tap(k);
        },{passive:false});
        // Fallback for desktop
        b.addEventListener('click',function(){tap(k);});
        d.appendChild(b);
      });
      vkbKeys.appendChild(d);
    });
  }

  function tap(k){
    if(!activeInput)return;
    if(k==='OK \u2713'){
      vkbClose();
      // Submit whichever screen's form is currently active
      setTimeout(function(){
        // Lobby email
        var lbl=document.getElementById('lobby-login-btn');
        if(lbl&&lbl.offsetParent!==null){doLobbyLogin&&doLobbyLogin();return;}
        // Gate email
        var gb=document.getElementById('gate-email-btn');
        if(gb&&gb.offsetParent!==null){gb.click();return;}
        // Main form submit
        var sb=document.getElementById('btn-submit');
        if(sb&&sb.offsetParent!==null){submitForm&&submitForm();return;}
        // Login screen
        var lb=document.getElementById('login-btn');
        if(lb&&lb.offsetParent!==null){lb.click();return;}
      },60);
      return;
    }
    if(k==='\u232b'){
      // Backspace — remove char at caret if supported, else trim end
      var v=activeInput.value;
      var pos=activeInput.selectionStart;
      if(typeof pos==='number'&&pos>0&&!activeInput.readOnly){
        activeInput.value=v.slice(0,pos-1)+v.slice(pos);
        try{activeInput.setSelectionRange(pos-1,pos-1);}catch(e){}
      } else {
        activeInput.value=v.slice(0,-1);
      }
      sync();return;
    }
    if(k==='\u21e7'){shifted=!shifted;buildKeys();return;}

// ── Leaderboard cache — 30s TTL to avoid hammering the sheet ──
var _lbdCache = null, _lbdCacheTs = 0;
var _playerIndex = {}; // email → {name,lastName,score} — full lookup table

async function fetchLeaderboard(){
  if(_lbdCache && (Date.now()-_lbdCacheTs)<30000) return _lbdCache;
  // Fetch more rows so fetchPlayerScore can find anyone, not just top 50
  const tq=encodeURIComponent('SELECT B,C,E ORDER BY E DESC LIMIT 100');
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}&tq=${tq}`;
  try{
    const res=await fetch(url);const text=await res.text();
    const json=JSON.parse(text.replace(/^[^(]+\(/,'').replace(/\);?\s*$/,''));
    if(!json.table||!json.table.rows){_lbdCache=[];_lbdCacheTs=Date.now();return[];}

    // Build full player index keyed by email (best score per email)
    _playerIndex = {};
    json.table.rows
      .filter(function(r){return r.c&&r.c[2]&&r.c[2].v!=null;})
      .forEach(function(r){
        var name  = String((r.c[0]&&r.c[0].v)||'').trim();
        var email = String((r.c[1]&&r.c[1].v)||'').toLowerCase().trim();
        var score = Number(String((r.c[2]&&r.c[2].v)||0).replace(/[\s,]/g,''))||0;
        if(!email) return;
        if(!_playerIndex[email] || score > _playerIndex[email].score){
          var parts = name.split(' ');
          _playerIndex[email] = {name:parts[0]||'', lastName:parts.slice(1).join(' ')||'', email:email, score:score};
        }
      });

    // Leaderboard display: deduplicate by email (best score per player), keep top 50
    // Using _playerIndex which already holds best score per email
    var result = Object.values(_playerIndex)
      .sort(function(a,b){return b.score-a.score;})
      .slice(0,50);

    _lbdCache=result;_lbdCacheTs=Date.now();
    return result;
  }catch(e){return _lbdCache||[];}
}

        proximityHTML=`<div class="lbd-proximity">🥇 TU ES EN TÊTE !<span>${gap2>0?'Tu mènes de '+Number(gap2).toLocaleString('fr-FR')+' pts sur le 2ème — reste devant !':'Profite — mais ils arrivent !'}</span></div>`;
      } else if(myIdx===1){
        const gapUp=players[0].score-myScore;
        const gapDown=players[2]?myScore-players[2].score:null;
        const downPart=gapDown>0?' · '+Number(gapDown).toLocaleString('fr-FR')+' pts d\'avance sur le 3ème':'';
        proximityHTML=`<div class="lbd-proximity">🥈 À <b>${Number(gapUp).toLocaleString('fr-FR')} pts</b> de la 1ère place !<span>Tu es 2ème${downPart} — rejoue !</span></div>`;
      } else if(myIdx===2){
        proximityHTML=`<div class="lbd-proximity">🥉 TU ES 3ème !<span>À ${Number(players[1].score-myScore).toLocaleString('fr-FR')} pts de la 2ème place — rejoue !</span></div>`;
      } else {
        const gap3=p3score!=null?p3score-myScore:null;
        const above=players[myIdx-1];
        const gapAbove=above?above.score-myScore:null;
        if(gap3!=null&&gap3>0){
          proximityHTML=`<div class="lbd-proximity">À <b>${Number(gap3).toLocaleString('fr-FR')} pts</b> de la 3ème place 🥉<span>${gapAbove>0?'Passe d\'abord le '+myIdx+'ème (+'+Number(gapAbove).toLocaleString('fr-FR')+' pts)':'Rejoue — le podium est à portée !'}</span></div>`;
        } else if(gap3===0){
          proximityHTML=`<div class="lbd-proximity">Tu es à égalité avec le 3ème !<span>Un point de plus et tu es dans le Top 3 🥉</span></div>`;
        }
      }
      if(proximityHTML){
        const d=document.createElement('div');d.innerHTML=proximityHTML;
        card.insertBefore(d.firstChild,card.firstChild);
      }
    }

    // ── PLAYER OUTSIDE TOP 100 — sticky card at bottom ─────────
    if(myIdx===-1 && myEmail && bestScore>0){
      // Find true rank from _playerIndex (has all players sorted by score)
      var allSorted = Object.values(_playerIndex).sort(function(a,b){return b.score-a.score;});
      var trueRank = allSorted.findIndex(function(p){return(p.email||'').toLowerCase().trim()===myEmail;});
      var myData = _playerIndex[myEmail];
      if(trueRank>=0 && myData){
        var trueRankNum = trueRank+1;
        var myPts = Number(myData.score).toLocaleString('fr-FR');
        var last3 = players.slice(-3); // last 3 in top 100 for gap reference
        var last = players[players.length-1];
        var gapToTop100 = last ? last.score - myData.score : null;
        var gapMsg = gapToTop100>0
          ? 'Il te manque <b>'+Number(gapToTop100).toLocaleString('fr-FR')+' pts</b> pour entrer dans le Top 100'
          : 'Tu es à la limite du Top 100 !';
        // Add ellipsis separator
        var sep='<div style="text-align:center;padding:8px 0;color:#777777;font-size:18px;letter-spacing:4px;">···</div>';
        // Sticky self row
        var selfRow='<div class="lbd-row mine" style="position:sticky;bottom:0;background:#fff8ee;border:2px solid #ff9900;box-shadow:0 -4px 16px rgba(255,153,0,.2);">'+
          '<div class="lbd-medal other" style="background:#ff9900;color:#fff;">'+trueRankNum+'</div>'+
          '<div class="lbd-name">'+(playerName&&playerLastName?playerName+' '+playerLastName:playerName||'Toi')+
            '<span class="lbd-you-badge">TOI</span></div>'+
          '<div class="lbd-score">'+myPts+' pts</div>'+
        '</div>'+
        '<div style="background:#fff8ee;border:0 solid #ff9900;border-width:0 2px 2px;border-radius:0 0 8px 8px;padding:8px 12px;margin-top:-4px;font-size:clamp(10px,2.6vw,12px);color:#e68800;font-family:var(--H2);text-align:center;">'+gapMsg+' — rejoue !</div>';
        var div=document.createElement('div');
        div.innerHTML=sep+selfRow;
        card.appendChild(div);
      }
    }

    // Inject rank into voucher header badge
    var rankBadge=document.getElementById('mv-rank-badge');
    if(rankBadge&&playerEmail){
      var myEmailR=playerEmail.toLowerCase().trim();
      var myIdxR=players.findIndex(function(p){return(p.email||'').toLowerCase().trim()===myEmailR;});
      if(myIdxR>=0){
        rankBadge.textContent='#'+(myIdxR+1)+' au classement';
        rankBadge.style.display='inline-block';
      }
    }

    // ── SCROLL TO MY ROW ────────────────────────────────────────
    if(myIdx>=0){
      // Double rAF ensures layout is fully flushed before measuring
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          var row=document.getElementById('lbd-row-'+myIdx);
          var container=document.querySelector('.lbd-scroll');
          if(!row||!container)return;
          var containerRect=container.getBoundingClientRect();
          var rowRect=row.getBoundingClientRect();
          // Position row at 40% from top (not center) — feels natural, shows rows above too
          var target=container.scrollTop+(rowRect.top-containerRect.top)-(containerRect.height*0.4)+(rowRect.height/2);
          container.scrollTo({top:Math.max(0,target),behavior:'smooth'});
        });
      });
    } else if(myIdx===-1 && bestScore>0){
      // Player not in top 100 — scroll to bottom to reveal sticky card
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          var container=document.querySelector('.lbd-scroll');
          if(container) container.scrollTo({top:container.scrollHeight,behavior:'smooth'});
        });
      });
    }

  }).catch(()=>{const c=$('lbd-card');if(c)c.innerHTML='<div class="lbd-empty">Classement hors ligne — réessaie dans un instant. <button onclick="goTo(renderLeaderboard)" style="margin-top:8px;display:block;width:100%;background:#ff9900;color:#fff;border:none;border-radius:8px;padding:10px;font-weight:900;font-family:var(--H1);font-size:13px;cursor:pointer;">↺ RÉESSAYER</button></div>';});

// ════════════════════════════════════════════════════════════════
//  FIT-TO-VIEWPORT — keeps everything above the fold on any device.
//  Wraps a screen's content; if it's taller than the viewport, scales
//  it down (with width compensation so it still fills the width).
//  On tall screens it stays 1× and the normal flex layout applies.
// ════════════════════════════════════════════════════════════════
var FIT_SCREENS=['screen-lobby','screen-result','screen-lock','screen-login'];

function fitScreen(screenEl){
  if(!screenEl)return;
  var w=screenEl.querySelector(':scope > .fitw');
  if(!w){
    w=document.createElement('div');
    w.className='fitw';
    while(screenEl.firstChild){ w.appendChild(screenEl.firstChild); }
    screenEl.appendChild(w);
  }
  screenEl.style.overflow='hidden';
  // reset to flex-fill (lets internal flex:1 spacers distribute on tall screens)
  w.style.transform='none';
  w.style.width='100%';
  w.style.flex='1 1 auto';
  w.style.display='flex';
  w.style.flexDirection='column';
  w.style.minHeight='100%';
  var vh=screenEl.clientHeight;
  if(!vh)return;
  var ch=w.scrollHeight;
  if(ch>vh+1){
    // content overflows → switch to natural height + scale down to fit
    w.style.flex='none';
    w.style.minHeight='0';
    var nat=w.scrollHeight;
    var s=Math.max(0.5,vh/nat);
    w.style.width=(100/s)+'%';
    w.style.transform='scale('+s+')';
  }
}

function fitCurrent(){
  for(var i=0;i<FIT_SCREENS.length;i++){
    var el=document.getElementById(FIT_SCREENS[i]);
    if(el){ fitScreen(el); return; }
  }
}

// Auto-fit on every screen render (innerHTML swap on #app)
(function(){
  var app=document.getElementById('app');
  if(!app)return;
  var mo=new MutationObserver(function(){
    requestAnimationFrame(fitCurrent);
    setTimeout(fitCurrent,120);   // after webfonts settle
    setTimeout(fitCurrent,450);   // after images settle
  });
  mo.observe(app,{childList:true});
  var _rt;
  window.addEventListener('resize',function(){clearTimeout(_rt);_rt=setTimeout(fitCurrent,80);});
  window.addEventListener('orientationchange',function(){setTimeout(fitCurrent,200);});
})();

function _fmtCountParts(ms){
  if(ms<0)ms=0;
  var s=Math.floor(ms/1000);
  var d=Math.floor(s/86400);s-=d*86400;
  var h=Math.floor(s/3600);s-=h*3600;
  var m=Math.floor(s/60);s-=m*60;
  return {d:d,h:h,m:m,s:s};
}

  const field=$('game-field');
  const flashL=$('touch-flash-left'),flashR=$('touch-flash-right'),hint=$('touch-hint');

  var _touchAnchor = {};
  var _primaryId   = -1;
  window._swipeActive = false;
  window._swipeVel    = 0;

  function dismissHint(){
    if(touchHintDismissed)return;touchHintDismissed=true;
    if(hint){hint.classList.add('hidden');setTimeout(function(){if(hint)hint.style.display='none';},600);}
  }

  function _applyGlovePos(fingerX){
    var fw=getFW();
    gloveX=Math.max(GW/2,Math.min(fw-GW/2,fingerX));
    var ge=document.getElementById('glove-el');
    if(ge){
      var tx=Math.round(gloveX-GW/2);
      ge.style.webkitTransform='translate3d('+tx+'px,0,0)';

    window._swipeDir = fingerX < (getFW()/2) ? 'l' : 'r';
  }

  field.addEventListener('touchstart',function(e){
    e.preventDefault();
    dismissHint();
    lastPressTime=Date.now();
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      _touchAnchor[t.identifier]={lastX:t.clientX,startGloveX:gloveX};
      if(_primaryId===-1){
        _primaryId=t.identifier;
        _applyGlovePos(t.clientX);
      }
    }
    window._swipeActive=true;
    window._swipeVel=0;
  },{passive:false});

  field.addEventListener('touchmove',function(e){
    e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      if(t.identifier!==_primaryId)continue;
      var anchor=_touchAnchor[t.identifier];
      if(!anchor)continue;
      window._swipeVel=t.clientX-anchor.lastX;
      anchor.lastX=t.clientX;
      _applyGlovePos(t.clientX);
    }
  },{passive:false});

  field.addEventListener('touchend',function(e){
    e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++){
      var id=e.changedTouches[i].identifier;
      delete _touchAnchor[id];
      if(_primaryId===id){
        var remaining=Object.keys(_touchAnchor);
        _primaryId=remaining.length>0?parseInt(remaining[0]):-1;
      }
    }
    if(_primaryId===-1){
      window._swipeActive=false;
    }
  },{passive:false});

  field.addEventListener('touchcancel',function(){
    _touchAnchor={};_primaryId=-1;
    window._swipeActive=false;window._swipeVel=0;
  },{passive:false});

  var _mDown=false,_mLast=0;
  field.addEventListener('pointerdown',function(e){
    if(e.pointerType==='touch')return;
    _mDown=true;_mLast=e.clientX;
    dismissHint();lastPressTime=Date.now();window._swipeActive=true;window._swipeVel=0;
    _applyGlovePos(e.clientX);
  });
  field.addEventListener('pointermove',function(e){
    if(e.pointerType==='touch'||!_mDown)return;
    var dx=e.clientX-_mLast;_mLast=e.clientX;
    window._swipeVel=dx;
    _applyGlovePos(e.clientX);
  });
  field.addEventListener('pointerup',function(e){
    if(e.pointerType==='touch')return;
    _mDown=false;window._swipeActive=false;
  });

  function _flushFlash(){
    if(!flashL||!flashR)return;
    var d=window._swipeDir;
    if(d==='l'){flashL.classList.add('active');flashR.classList.remove('active');}
    else if(d==='r'){flashR.classList.add('active');flashL.classList.remove('active');}
    if(!window._swipeActive){flashL.classList.remove('active');flashR.classList.remove('active');window._swipeDir=null;}
  }
  window._swipeDir=null;
  window._flushFlash=_flushFlash;

  const co=$('btn-cashout');
  if(co){
    let armed=false,timer=null;
    co.addEventListener('pointerdown',()=>{
      if(!armed){armed=true;co.textContent='Sûr(e) ?';co.classList.add('confirm-mode');timer=setTimeout(()=>{armed=false;co.innerHTML='<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><circle cx="5" cy="5" r="4.5" stroke="currentColor" stroke-width="1.2"/><line x1="5" y1="1.5" x2="5" y2="5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="5" y1="5" x2="7.5" y2="5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>Encaisser';co.classList.remove('confirm-mode');},2500);}
      else{clearTimeout(timer);endGame(scoreVal);}
    });
  }

  const mb=$('btn-mute');
  if(mb)mb.addEventListener('pointerdown',()=>toggleMusic(mb));
}

// ── CACHED DOM REFS (populated once per game, cleared on end) ──
var _domCache = {};
function _dom(id){ return _domCache[id] || (_domCache[id] = document.getElementById(id)); }
function _clearDomCache(){ _domCache = {}; }

function startGame(){
  _track('game_start',{attempts_left:attempts});
  // Check daily streak — may award bonus attempt
  var streakDay=checkStreak();
  if(streakDay>0){
    setTimeout(function(){
      var el=document.createElement('div');
      el.style.cssText='position:fixed;top:20%;left:50%;transform:translateX(-50%);background:#ff9900;color:#fff;font-family:var(--H1);font-weight:900;font-size:clamp(13px,3.5vw,16px);padding:10px 22px;border-radius:24px;z-index:9000;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.3);animation:tierUpIn .3s ease;';
      el.innerHTML=IC.flame+' '+streakDay+' jours de suite — +1 essai bonus !';
      document.body.appendChild(el);
      setTimeout(function(){el.remove();},3000);
    },1500);
  }
  startMusic();
  done=false;wid=0;itemsArr=[];
  livesVal=3;scoreVal=0;comboVal=0;maxComboVal=0;speedVal=1.1;elapsedSec=0;lastTierReached=0;
  _catchCount=0;_lastRankShown=-1;
  lastT=null;lastSpawn=0;spawnInt=2000;pressDir=null;lastPressTime=0;touchHintDismissed=false;
  window._swipeVel=0;window._swipeActive=false;
  window._adrenaline=false;window._adrenalineShown=false;
  _clearDomCache();
  renderGame();
  gloveX=getFW()/2;
  // Pre-cache all game DOM refs immediately after render
  _dom('glove-el');_dom('glove-shake');_dom('score-disp');_dom('combo-badge');
  _dom('danger-bar');_dom('dodge-hint');_dom('screen-game');
  _dom('catch-ring');
  _dom('game-field');
  updateLivesDisplay();
  animId=requestAnimationFrame(tick);
}

function updateLivesDisplay(){
  var container=document.getElementById('lives-hearts');
  if(!container)return;
  var maxLives=3; // max hearts to display (extensible)
  // Rebuild hearts if count changed (handles bonus lives)
  if(container.children.length!==maxLives){
    container.innerHTML='';
    for(var j=1;j<=maxLives;j++){
      var s=document.createElement('span');
      s.className='lives-heart-icon';
      s.id='lh-'+j;
      s.innerHTML=IC.heart;
      container.appendChild(s);
    }
  }
  // Update each heart state
  for(var i=1;i<=maxLives;i++){
    var h=document.getElementById('lh-'+i);
    if(!h)continue;
    if(i<=livesVal){ h.classList.remove('lost'); }
    else { h.classList.add('lost'); }
  }
  // Flash to full opacity on life loss
  container.classList.add('flash');
  setTimeout(function(){
    var c=document.getElementById('lives-hearts');
    if(c)c.classList.remove('flash');
  },600);
  // Red glow on last life
  container.style.filter=livesVal===1
    ?'drop-shadow(0 0 8px rgba(236,35,38,.8))':'';
}

function tick(ts){
  if(done)return;
  if(!lastT)lastT=ts;
  const dt=Math.min((ts-lastT)/16,3);lastT=ts;
  // Cache fw/fh once per frame — not recalculated inside loop
  const fw=getFW(),fh=getFH(),cy=CATCH_Y(fh);
  elapsedSec+=dt/60;

  var isAdrenaline = elapsedSec >= 90;
  if(isAdrenaline && !window._adrenalineShown){
    window._adrenalineShown=true;
    window._adrenaline=true;
    showTierUp('VITESSE MAX !','⚡');
    var hud=_dom('screen-game');
    if(hud)hud.style.animation='adrenalinePulse 1.2s ease-in-out infinite';
  }

  var speedBase = isAdrenaline
    ? Math.min(7.0, 3.0 + (elapsedSec-90)*0.06)
    : Math.min(4.0, 1.1 + elapsedSec*0.03);
  speedVal = speedBase;

  var spawnBase = isAdrenaline
    ? Math.max(380, 900 - (elapsedSec-90)*8)
    : Math.max(750, 2200 - elapsedSec*22);
  spawnInt = spawnBase;

  // ── COAST MOMENTUM ───────────────────────────────────────
  if(!window._swipeActive && window._swipeVel){
    var coastDelta = window._swipeVel * 0.45;
    if(Math.abs(coastDelta) > 0.5){
      gloveX = Math.max(GW/2, Math.min(fw-GW/2, gloveX + coastDelta));
      window._swipeVel = coastDelta;
      var ge2=_dom('glove-el');
      if(ge2){
        var tx2=Math.round(gloveX-GW/2);
        ge2.style.webkitTransform='translate3d('+tx2+'px,0,0)';
        ge2.style.transform      ='translate3d('+tx2+'px,0,0)';
      }
    } else { window._swipeVel=0; }
  }
  if(window._flushFlash) window._flushFlash();

  // Use cached glove ref
  const ge=_dom('glove-el');

  // ── SPAWN ────────────────────────────────────────────────
  // Cap max items on screen to prevent GC thrash on low-RAM
  const MAX_ITEMS = 8;
  if(ts-lastSpawn>spawnInt && itemsArr.length<MAX_ITEMS){
    const item=spawnItem(speedVal);itemsArr.push(item);lastSpawn=ts;addItemEl(item);
    if(elapsedSec>45 && itemsArr.length<MAX_ITEMS-1){
      var extraChance = isAdrenaline ? 0.70 : 0.35;
      if(Math.random()<extraChance){
        setTimeout(function(){if(done||itemsArr.length>=MAX_ITEMS)return;var i2=spawnItem(speedVal*0.88);itemsArr.push(i2);addItemEl(i2);},280);
      }
      if(isAdrenaline && Math.random()<0.40 && itemsArr.length<MAX_ITEMS-1){
        setTimeout(function(){if(done||itemsArr.length>=MAX_ITEMS)return;var i3=spawnItem(speedVal*0.78);itemsArr.push(i3);addItemEl(i3);},520);
      }
    }
  }

  // ── ITEM LOOP — index-based to avoid .filter() GC alloc ──
  let livesLost=0,ptsGained=0,newCombo=comboVal,closestRed=9999;
  var writeIdx=0;
  for(var ri=0;ri<itemsArr.length;ri++){
    var item=itemsArr[ri];
    item.y+=item.speed*dt;
    var el=document.getElementById('w-'+item.id);
    if(el) el.style.top=Math.round(item.y)+'px';
    var cx=item.x+item.width/2, inGlove=cx>=gloveX-GW/2&&cx<=gloveX+GW/2;

    // Danger proximity for red cards
    if(item.type==='redcard'){
      var d=cy-item.y;
      if(d>0&&d<closestRed)closestRed=d;
      if(el){if(d<100)el.classList.add('danger-close');else el.classList.remove('danger-close');}
    }

    var caught=false, remove=false;
    if(item.y+item.height*.5>=cy && item.y<cy+GH){
      if(inGlove){
        caught=true;
        if(item.type==='ball'){
          newCombo++;var pts=Math.round((25+Math.floor(elapsedSec)*.3)*Math.min(newCombo,3));ptsGained+=pts;
          showFlash(Math.min(Math.max(cx-30,0),fw-80),cy-44,'+'+pts+' ARRÊT !',true);sfxCatch();triggerRing(gloveX,cy);
          if(ge){ge.classList.add('catching');setTimeout(function(){var g=_dom('glove-el');if(g)g.classList.remove('catching');},300);}
        }else if(item.type==='golden'){
          newCombo++;var pts=Math.round((75+Math.floor(elapsedSec)*.3)*Math.min(newCombo,3));ptsGained+=pts;
          showFlash(Math.min(Math.max(cx-40,0),fw-100),cy-44,'BONUS +'+pts,true);sfxGolden();triggerRing(gloveX,cy);
          if(ge){ge.classList.add('catching');setTimeout(function(){var g=_dom('glove-el');if(g)g.classList.remove('catching');},300);}
        }else{
          // Red card — check swipe dodge
          if(Date.now()-lastPressTime<180){caught=false;remove=true;}
          else{
            newCombo=0;livesLost++;
            showFlash(Math.min(Math.max(cx-40,0),fw-100),cy-50,'ROUGE !',false);sfxRedCard();
            var sg=_dom('screen-game');if(sg){sg.classList.add('hit-flash');setTimeout(function(){var s=_dom('screen-game');if(s)s.classList.remove('hit-flash');},400);}
            var gs=_dom('glove-shake');if(gs){gs.classList.remove('big-shake');void gs.offsetWidth;gs.classList.add('big-shake');setTimeout(function(){var s=_dom('glove-shake');if(s)s.classList.remove('big-shake');},500);}
          }
        }
        remove=true;
      }
    }
    if(!remove && item.y>fh+10){
      if(item.type==='ball'||item.type==='golden'){
        newCombo=0;
        var cb=_dom('combo-badge');if(cb)cb.style.display='none';
      }
      remove=true;
    }
    if(remove){
      if(el)el.remove();
    } else {
      itemsArr[writeIdx++]=item;
    }
  }
  itemsArr.length=writeIdx; // truncate in-place — no GC alloc

  // ── DANGER BAR ───────────────────────────────────────────
  var db=_dom('danger-bar'),dh=_dom('dodge-hint');
  if(db){
    if(closestRed<120){
      var di=Math.max(0,(120-closestRed)/120);
      db.style.height=(di*8)+'px';db.style.opacity=di;
      if(dh){dh.style.top=(cy-48-(di*12))+'px';dh.style.opacity=closestRed<60?'1':'0';}
    }else{
      db.style.height='0';db.style.opacity='0';
      if(dh)dh.style.opacity='0';
    }
  }

  comboVal=newCombo;if(newCombo>maxComboVal)maxComboVal=newCombo;

  if(ptsGained){
    scoreVal+=ptsGained;
    var sd=_dom('score-disp');if(sd)sd.textContent=scoreVal;
    // Tier-up toasts
    const tiers=[{t:5000,l:'LÉGENDE',d:'60 DH'},{t:2000,l:'CHAMPION',d:'50 DH'},{t:750,l:'MATCH READY',d:'30 DH'},{t:300,l:'DÉBUTANT',d:'20 DH'}];
    for(var ti=0;ti<tiers.length;ti++){
      if(scoreVal>=tiers[ti].t&&lastTierReached<tiers[ti].t){lastTierReached=tiers[ti].t;showTierUp(tiers[ti].l,tiers[ti].d);break;}
    }
    // Rank motivation every 10 catches — update _playerIndex with live score first
    _catchCount++;
    if(_catchCount%10===0){
      if(playerEmail&&_playerIndex){
        var _me=playerEmail.toLowerCase().trim();
        if(_playerIndex[_me]) _playerIndex[_me].score=scoreVal;
        else _playerIndex[_me]={name:playerName||'Joueur',lastName:playerLastName||'',email:_me,score:scoreVal};
      }
      _checkRankMotivation();
    }
    // Score circle ring — cached via querySelector (called once on first pts gain)
    if(!_domCache['_circle'])_domCache['_circle']=document.querySelector('.score-circle');
    var circle=_domCache['_circle'];
    if(circle){
      var ring = scoreVal>=5000?'0 0 0 3px rgba(255,230,80,1),0 4px 20px rgba(0,0,0,.5)':
                 scoreVal>=2000?'0 0 0 3px rgba(255,186,0,1),0 4px 20px rgba(0,0,0,.5)':
                                '0 0 0 3px var(--orange),0 4px 20px rgba(0,0,0,.5)';
      circle.style.boxShadow=ring;
    }
  }

  var cb=_dom('combo-badge');
  if(cb){cb.style.display=newCombo>1?'inline-block':'none';cb.textContent='×'+Math.min(newCombo,3)+' COMBO';}

  if(livesLost){livesVal=Math.max(0,livesVal-livesLost);updateLivesDisplay();if(livesVal<=0){endGame(scoreVal);return;}}
  animId=requestAnimationFrame(tick);
}

function addItemEl(item){
  var field=_dom('game-field');if(!field)return;
  var el=document.createElement('div');
  el.id='w-'+item.id;
  el.style.left=item.x+'px';
  el.style.top=item.y+'px';
  if(item.type==='ball'){el.className='falling-item item-ball';el.innerHTML='<img src="'+IMG_SOCCER+'" alt="" draggable="false">';}
  else if(item.type==='golden'){el.className='falling-item item-golden';el.innerHTML='<img src="'+IMG_GOLDEN+'" alt="" draggable="false">';}
  else{el.className='falling-item item-redcard';el.style.width=item.width+'px';el.style.height=item.height+'px';el.innerHTML='<img src="'+IMG_REDCARD+'" alt="" draggable="false">';}
  field.appendChild(el);
}

function triggerRing(x,y){
  var r=_dom('catch-ring');if(!r)return;
  r.style.left=(x-30)+'px';r.style.top=(y-30)+'px';r.style.width='60px';r.style.height='60px';
  r.classList.remove('pop');void r.offsetWidth;r.classList.add('pop');

function endGame(final){
  if(done)return;done=true;
  cancelAnimationFrame(animId);
  stopMusic();
  scoreVal=final;
  attempts=Math.max(0,attempts-1);
  _track('game_end',{score:final,combo:Math.min(maxComboVal,3),survie:Math.floor(elapsedSec),voucher:getVoucher(final).code});
  var _prevBest=bestScore;
  if(final>bestScore)bestScore=final;
  if(final>_prevBest&&_prevBest>0){window._newRecord=true;}else{window._newRecord=false;}
  var ev=getVoucher(final);
  var tierKey=ev.code;
  var existing=earnedVouchers.filter(function(x){return x.code===tierKey;})[0];
  if(!existing||final>existing.score){
    earnedVouchers=earnedVouchers.filter(function(x){return x.code!==tierKey;});
    earnedVouchers.push({score:final,disc:ev.disc,code:ev.code,label:ev.label,min:ev.min,date:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})});
  }
  hasPlayedOnce=true;
  saveSession(); // always persist attempts count (works for anonymous players too)
  // Bust leaderboard cache so next open shows fresh data with this score
  _lbdCache=null;_lbdCacheTs=0;
  // Notify parent app (Jumia WebView) about the game result
  try{
    window.parent.postMessage({
      type:'jumia_game_end',
      score:final,
      voucher:getVoucher(final).code,
      discount:getVoucher(final).disc,
      player:playerEmail||null
    },'*');
  }catch(e){}
  // Inject player into _playerIndex immediately so they appear in leaderboard
  // even before the sheet has processed the submission
  if(playerEmail){
    var _myEmail=playerEmail.toLowerCase().trim();
    if(!_playerIndex[_myEmail]||final>(_playerIndex[_myEmail].score||0)){
      _playerIndex[_myEmail]={name:playerName||'Joueur',lastName:playerLastName||'',email:_myEmail,score:final};
    }
  }
  if(SHEET_URL.startsWith('https://')&&playerName){
    const p=new URLSearchParams({timestamp:new Date().toISOString(),name:playerName+(playerLastName?' '+playerLastName:''),email:playerEmail,city:playerCity,score:final,combo:Math.min(maxComboVal,3),survie:Math.floor(elapsedSec),voucher:getVoucher(final).code,source:'JumiaGardienDeBut'});
    fetch(SHEET_URL+'?'+p.toString(),{method:'GET',mode:'no-cors'}).catch(()=>{});

}

// ── LAYER 1: VALIDATION HELPERS ─────────────────────────────────────────────

// Hard-block: known placeholder / garbage names
var _BAD_NAME = /^(test|demo|fake|dummy|admin|user|joueur|anonyme|inconnu|nobody|someone|azerty|qwerty|azert|qwert|asdfgh?|zxcvbn?|aaa+|bbb+|ccc+|ddd+|eee+|fff+|xxx+|yyy+|zzz+|abc|bca|cba|xyz|nom|prenom|prénom|foo|bar|baz|na|none|null|undefined|n\/a|rien|blabla|blablab|toto|tata|titi|tutu|momo|lolo|nono|roro|soso|jojo|coco|dodo|gogo|bobo|bibi|kiki|zizi|fifi|mimi|nini|popo|riri|vivi|wawa|yoyo|zebi|haha|hihi|huhu|héhé|hoho|hehe)$/i;

// Hard-block: all-same char repeated (aaaa, 1111, …..)
var _REPEAT_CHAR = /^(.)\1{2,}$/;

// Hard-block: all-digit names (123, 456789)
var _ALL_DIGITS = /^\d+$/;

// Hard-block: keyboard walks (azerty, qsdf, …) — also catches substrings
var _KEYBOARD = /^(az|qsd|qwer|azer|zxcv|asdf){1}/i;

// Hard-block: disposable / temp email services
var _DISPOSABLE_EMAIL = /(mailinator|yopmail|trashmail|tempmail|maildrop|guerrillamail|throwam|fakeinbox|10minutemail|sharklasers|spam4|dispostable|spamgourmet|dodgit|trashmail|mailnull|spamspot|binkmail|safetymail|mailtothis|throwaway|discard\.email|tempr\.email|getnada|filzmail|trbvm|tempmailaddress|discard\.email|mailnesia|spamex|spaml|spamoff|spamhere|spamfree24|cool\.fr\.nf|jetable\.fr\.nf|nospamfor|no-spam|antispam|spamcon|spam\.la|haltospam|spaml\.de|sogetthis|mailhazard|spamgob|meltmail|spamfree|klzlk|baxomale|binkmail|bloatbox|bobmail|bodhi\.lawlita|bofthew|bspamfree|bugmenot|bulkbye|bumpymail)/i;

// Hard-block: Moroccan competitors — we flag and block silently
var _COMPETITOR_DOMAINS = /^[^@]+@(marjane\.ma|aswak-assalam\.ma|aswakassalam\.ma|bim\.ma|Label\'vie\.com|labelvie\.com|carrefour\.ma|carrefourmaroc\.ma|lidl\.ma|amazon\.|amazon\.fr|amazon\.com|noon\.|noon\.com|noon\.ae|alibaba\.|alibaba\.com|aliexpress\.|aliexpress\.com|shein\.|shein\.com|temu\.|temu\.com|shopify\.|ebay\.|ebay\.fr|cdiscount\.|cdiscount\.com|fnac\.|fnac\.com|darty\.|darty\.com|inmaa\.ma|hmizate\.ma|msouk\.ma|espace-high-tech\.com|matelpro\.com|electroplanet\.ma|biougnach\.com|acima\.ma|seraphin\.ma|shopping\.ma|souq\.|laredoute\.|galeries-lafayette\.|printemps\.)/i;

// Soft-flag: suspicious but don't block (goes to sheet with suspicious:true)
var _SUSPICIOUS_NAME = /^[a-z]{1,2}$/i;  // single/double letter names

function _validateName(val){
  if(!val || val.length < 2) return 'Prénom trop court';
  if(_ALL_DIGITS.test(val))  return 'Prénom invalide';
  if(_REPEAT_CHAR.test(val)) return 'Prénom invalide';
  if(_BAD_NAME.test(val))    return 'Prénom invalide';
  if(_KEYBOARD.test(val) && val.length < 5) return 'Prénom invalide';
  return null; // valid
}

function _validateEmail(val){
  var emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  if(!emailRe.test(val))          return 'E-mail invalide';
  if(_DISPOSABLE_EMAIL.test(val)) return 'E-mail invalide';
  if(_COMPETITOR_DOMAINS.test(val)) return null; // let through but will be flagged below
  return null;
}

// Moroccan mobile: 06/07 + 8 digits, or +212/00212 6|7 + 8 digits.
function _normalizePhone(val){
  var d=(val||'').replace(/[\s.\-()]/g,'');
  if(/^\+212[67]\d{8}$/.test(d)) return '0'+d.slice(4);
  if(/^00212[67]\d{8}$/.test(d)) return '0'+d.slice(5);
  if(/^212[67]\d{8}$/.test(d)) return '0'+d.slice(3);
  return d;
}
function _validatePhone(val){
  var d=_normalizePhone(val);
  if(!d) return 'Téléphone requis';
  if(!/^0[67]\d{8}$/.test(d)) return 'Numéro marocain invalide (ex. 06 12 34 56 78)';
  return null;
}

function _isSuspicious(name, lastname, email){
  if(_COMPETITOR_DOMAINS.test(email)) return true;
  if(_SUSPICIOUS_NAME.test(name))     return true;
  if(_SUSPICIOUS_NAME.test(lastname)) return true;
  // Name looks generic even if not in hard-block list
  if(name === lastname)               return true;
  return false;
}

// ── LAYER 2: SCORING GATE ────────────────────────────────────────────────────
var MIN_SCORE_TO_SUBMIT = 50; // must have caught at least a few balls

function submitForm(){
  // Remove readonly (set by VKB) before reading values
  ['inp-name','inp-lastname','inp-phone','inp-email'].forEach(function(id){var el=$(id);if(el)el.removeAttribute('readonly');});
  var _n=$('inp-name');const name=(_n?_n.value.trim():'');
  var _ln=$('inp-lastname');const lastname=(_ln?_ln.value.trim():'');
  var _ph=$('inp-phone');const phone=_normalizePhone(_ph?_ph.value:'');
  var _em=$('inp-email');const email=(_em?_em.value.trim():'').toLowerCase();
  const city='Maroc';
  let valid=true;

  // ── Scoring gate — must have actually played ──────────────────
  if(scoreVal < MIN_SCORE_TO_SUBMIT){
    var sg=$('inp-name');
    if(sg) sg.focus();
    // Show a gentle message without blocking the UI harshly
    var errEl=$('err-name');
    if(errEl){
      errEl.textContent='Joue d\'abord pour gagner tes bons !';
      errEl.classList.add('visible');
      setTimeout(function(){if(errEl)errEl.classList.remove('visible');},3000);
    }
    return;
  }

  // ── Field validation ──────────────────────────────────────────
  var nameErr     = _validateName(name);
  var lastnameErr = _validateName(lastname);
  var phoneErr    = _validatePhone(phone);
  var emailErr    = _validateEmail(email);

  var fields=[
    ['inp-name',     'err-name',     nameErr,     nameErr||''],
    ['inp-lastname', 'err-lastname', lastnameErr, lastnameErr||''],
    ['inp-phone',    'err-phone',    phoneErr,    phoneErr||''],
    ['inp-email',    'err-email',    emailErr,    emailErr||''],
  ];
  fields.forEach(function(_f){
    var id=_f[0],eid=_f[1],fail=_f[2],msg=_f[3];
    var _fe=$(id);if(_fe)_fe.classList.toggle('error',!!fail);
    var em=$(eid);if(em){em.textContent=msg;em.classList.toggle('visible',!!fail);}
    if(fail)valid=false;
  });
  if(!valid)return;

  // ── Layer 3: silent suspicious flag ──────────────────────────
  var suspicious = _isSuspicious(name, lastname, email);

  // Show spinner while we check
  const btn=$('btn-submit'),lbl=$('submit-label'),spn=$('submit-spinner');
  if(btn)btn.disabled=true;if(lbl)lbl.style.display='none';if(spn)spn.style.display='block';

  var normEmail=email;

  // ── Check if this email already exists in the sheet ──────────
  fetchPlayerScore(normEmail).then(function(existing){

    if(existing && existing.score > 0){
      // ── RETURNING PLAYER ─────────────────────────────────────
      playerName     = existing.name     || name;
      playerLastName = existing.lastName || lastname;
      playerEmail    = normEmail;
      playerCity     = city || playerCity;
      playerPhone    = phone || playerPhone;
      bestScore      = Math.max(existing.score, scoreVal, bestScore);
      earnedVouchers = vouchersFromScore(bestScore);
      hasPlayedOnce  = true;
      saveSession();
      if(SHEET_URL.startsWith('https://')){
        const p=new URLSearchParams({timestamp:new Date().toISOString(),name:playerName+' '+playerLastName,phone:playerPhone,email:playerEmail,city:playerCity,score:scoreVal,combo:Math.min(maxComboVal,3),survie:Math.floor(elapsedSec),voucher:getVoucher(scoreVal).code,source:'JumiaGardienDeBut'});
        if(suspicious) p.set('suspicious','true');
        fetch(SHEET_URL+'?'+p.toString(),{method:'GET',mode:'no-cors'}).catch(()=>{});
      }
      _lbdCache=null;_lbdCacheTs=0;
      _playerIndex[normEmail]={name:playerName,lastName:playerLastName,email:normEmail,score:bestScore};
      goTo(function(){renderMyVouchers(true)});

    } else {
      // ── NEW PLAYER ───────────────────────────────────────────
      playerName=name;playerLastName=lastname;playerEmail=normEmail;playerCity=city;playerPhone=phone;
      _track('form_submit',{email:normEmail,score:scoreVal,is_new:true});
      saveSession();
      _lbdCache=null;_lbdCacheTs=0;
      _playerIndex[normEmail]={name:name,lastName:lastname,email:normEmail,score:scoreVal};
      if(SHEET_URL.startsWith('https://')){
        const p=new URLSearchParams({timestamp:new Date().toISOString(),name:playerName+' '+playerLastName,phone:playerPhone,email:playerEmail,city:playerCity,score:scoreVal,combo:Math.min(maxComboVal,3),survie:Math.floor(elapsedSec),voucher:getVoucher(scoreVal).code,source:'JumiaGardienDeBut'});
        if(suspicious) p.set('suspicious','true');
        fetch(SHEET_URL+'?'+p.toString(),{method:'GET',mode:'no-cors'}).catch(()=>{});
      }
      goTo(function(){renderMyVouchers(true)});
    }

  }).catch(function(){
    playerName=name;playerLastName=lastname;playerEmail=normEmail;playerCity=city;playerPhone=phone;
    saveSession();
    _lbdCache=null;_lbdCacheTs=0;
    _playerIndex[normEmail]={name:name,lastName:lastname,email:normEmail,score:scoreVal};
    if(SHEET_URL.startsWith('https://')){
      const p=new URLSearchParams({timestamp:new Date().toISOString(),name:playerName+' '+playerLastName,phone:playerPhone,email:playerEmail,city:playerCity,score:scoreVal,combo:Math.min(maxComboVal,3),survie:Math.floor(elapsedSec),voucher:getVoucher(scoreVal).code,source:'JumiaGardienDeBut'});
      if(suspicious) p.set('suspicious','true');
      fetch(SHEET_URL+'?'+p.toString(),{method:'GET',mode:'no-cors'}).catch(()=>{});
    }
    goTo(function(){renderMyVouchers(true)});
  });
}

    <div id="rs-rank-nudge"></div>
    <div style="flex:1;min-height:clamp(12px,3vw,20px);"></div>
    <div class="rs-actions">

        ?`<button class="rs-cta-primary" id="btn-replay">${IC.ball} REJOUER</button>`

  if(copy)copy.addEventListener('click',()=>copyCode(v.code,copy));

  });

  if(rep)rep.addEventListener('click',()=>goTo(startGame));

  const lbdBtn=$('btn-go-lbd');
  if(lbdBtn)lbdBtn.addEventListener('click',()=>goTo(renderLeaderboard));
