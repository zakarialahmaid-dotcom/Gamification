<style>
@font-face{font-family:'HelveticaDisplay';src:url('https://raw.githubusercontent.com/Madzack69/Fonts/main/helvetica-compressed-5871d14b6903a.otf') format('opentype');font-weight:900;}
@font-face{font-family:'HelveticaText';src:url('https://raw.githubusercontent.com/Madzack69/Fonts/main/Helvetica-Bold.ttf') format('truetype');font-weight:700;}
@font-face{font-family:'HelveticaText';src:url('https://raw.githubusercontent.com/Madzack69/Fonts/main/Helvetica.ttf') format('truetype');font-weight:500;}
@font-face{font-family:'Gotham';src:url('https://raw.githubusercontent.com/Madzack69/Fonts/main/Gotham-Black.otf') format('opentype');font-weight:900;}

:root{
  --bg:      #F1F1F2;
  --card:    #ffffff;
  --border:  #E4E4E6;
  --navy:    #1E293B;
  --grey:    #8A8A9A;
  --greyL:   #D0D0D6;
  --orange:  #ff9900;
  --orangeD: #e68800;
  --yellow:  #ffba00;
  --red:     #ec2326;
  --redD:    #a31a1d;
  --white:   #ffffff;
  --dark:    #1E293B;
  --panel:   #ffffff;
  --blue:    #1E293B;
  --blueD:   #111827;
  --tintWarm:#fff8ee;
  --H1: 'HelveticaDisplay','Arial Black',Arial,sans-serif;
  --H2: 'HelveticaText','Arial',sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#F1F1F2;overscroll-behavior:none;touch-action:none;-webkit-overflow-scrolling:touch;}
body{display:flex;align-items:stretch;justify-content:center;-webkit-user-select:none;user-select:none;background:#F1F1F2;}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:#F1F1F2;overflow:hidden;font-family:var(--H1);position:relative;touch-action:none;}

@keyframes fadeIn{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-60px) scale(.8)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes bigShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
@keyframes screenFlash{0%,100%{background:#1E293B}40%{background:#3a0000}70%{background:#2a0000}}
@keyframes itemIn{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
@keyframes goldenSpin{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
@keyframes dangerPulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wipeIn{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes ctaBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes tierUpIn{0%{opacity:0;transform:scale(.7)}60%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes tapRing{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
@keyframes hintLeft{0%,100%{transform:translateX(0);opacity:.6}50%{transform:translateX(-7px);opacity:1}}
@keyframes hintRight{0%,100%{transform:translateX(0);opacity:.6}50%{transform:translateX(7px);opacity:1}}

#loading-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:#F1F1F2;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .4s;}
#loading-screen.fade-out{opacity:0;pointer-events:none;}
.loading-logo{font-size:clamp(38px,12vw,54px);font-weight:900;color:#1E293B;font-family:var(--H1);line-height:.9;text-align:center;text-transform:uppercase;letter-spacing:-.01em;}
.loading-sub{font-size:clamp(10px,2.8vw,12px);color:#8A8A9A;font-family:var(--H2);font-weight:700;text-transform:uppercase;letter-spacing:.14em;}
.loading-bar-wrap{width:clamp(160px,45vw,220px);height:4px;background:#E4E4E6;border-radius:2px;overflow:hidden;}

.loading-gloves{height:clamp(52px,14vw,68px);width:auto;filter:drop-shadow(0 3px 8px rgba(30,41,59,.2));}

#rotate-screen{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#F1F1F2;z-index:99998;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
#rotate-screen.show{display:flex;}
.rotate-msg{font-size:clamp(16px,5vw,20px);font-weight:900;color:var(--white);font-family:var(--H1);text-align:center;}
@media (orientation:landscape) and (max-height:500px){body{display:none;}}

#play-transition{position:fixed;top:0;left:0;right:0;bottom:0;background:#ff9900;z-index:9999;pointer-events:none;transform:scaleY(0);transform-origin:bottom;}
#play-transition.go{animation:wipeIn .45s cubic-bezier(.76,0,.24,1) forwards;}

#screen-game{flex:1;display:flex;flex-direction:column;overflow:hidden;animation:fadeIn .15s ease;}
.gm-hud{flex:0 0 auto;background:var(--orange);padding:clamp(8px,2vw,12px) clamp(14px,4vw,22px);display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--orangeD);}
.gm-title{font-size:clamp(16px,4.5vw,22px);font-weight:900;color:#ffffff;font-family:var(--H1);text-transform:uppercase;line-height:1;}
.gm-title span{color:rgba(255,255,255,.65);}
.combo-badge{background:#ff9900;color:#ffffff;border-radius:6px;padding:3px 10px;font-size:clamp(10px,2.6vw,12px);font-weight:900;display:none;font-family:var(--H1);white-space:nowrap;pointer-events:none;margin-left:auto;}

#game-field{flex:1;position:relative;overflow:hidden;touch-action:none;-ms-touch-action:none;background:url('https://raw.githubusercontent.com/Madzack69/Icons/main/BG_GREEN_FIELD_OP.webp') center/cover no-repeat;}

#game-overlay{position:absolute;top:clamp(10px,2.5vw,14px);right:clamp(10px,2.5vw,14px);display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vw,12px);z-index:8;}
.score-circle{width:clamp(60px,15vw,74px);height:clamp(60px,15vw,74px);background:#ffffff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(255,255,255,.8),0 4px 16px rgba(0,0,0,.25);flex-shrink:0;}
.score-num{font-size:clamp(17px,5vw,22px);font-weight:900;color:#1E293B;line-height:1;font-family:var(--H1);}

.item-ball{width:clamp(42px,11vw,56px);height:clamp(42px,11vw,56px);filter:drop-shadow(0 3px 6px rgba(0,0,0,.7)) drop-shadow(0 0 2px rgba(0,0,0,.5));}
.item-ball img{width:100%;height:100%;object-fit:contain;border-radius:50%;}

.item-golden{width:clamp(42px,11vw,56px);height:clamp(42px,11vw,56px);filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));animation:goldenSpin 1.2s linear infinite,itemIn .15s ease;}
.item-golden img{width:100%;height:100%;object-fit:contain;border-radius:50%;}
.item-redcard{width:clamp(58px,15vw,76px);height:clamp(76px,20vw,100px);filter:drop-shadow(0 0 8px rgba(255,0,0,.7)) drop-shadow(0 4px 10px rgba(0,0,0,.5));}
.item-redcard img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none;}
.item-redcard.danger-close{filter:drop-shadow(0 0 12px rgba(255,0,0,1)) drop-shadow(0 0 22px rgba(255,0,0,.6));animation:dangerPulse .35s ease infinite;}

#glove-el{position:absolute;z-index:6;left:0;width:90px;display:flex;align-items:center;justify-content:center;will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden;-webkit-transform:translate3d(0,0,0);transform:translate3d(0,0,0);contain:layout style;}
#glove-shake{display:flex;align-items:center;justify-content:center;width:90px;}

#catch-ring{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.8);opacity:0;pointer-events:none;z-index:7;transform:scale(0);transition:transform .3s,opacity .3s;}
#catch-ring.pop{opacity:1;-webkit-transform:scale(1.6);transform:scale(1.6);}

.flash-msg{position:absolute;border-radius:20px;padding:4px 13px;font-size:clamp(12px,3.2vw,15px);font-weight:900;pointer-events:none;animation:floatUp 1.1s ease forwards;z-index:10;white-space:nowrap;font-family:var(--H1);}

#danger-bar{position:absolute;bottom:0;left:0;right:0;height:0;background:var(--red);transition:height .15s,opacity .15s;opacity:0;z-index:3;}
#dodge-hint{position:absolute;left:50%;transform:translateX(-50%);background:rgba(236,35,38,.92);color:#fff;border-radius:20px;padding:4px 14px;font-size:11px;font-weight:900;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;z-index:8;font-family:var(--H2);}

#btn-mute{position:absolute;bottom:clamp(10px,2.5vw,14px);left:clamp(10px,2.5vw,14px);width:clamp(32px,8vw,40px);height:clamp(32px,8vw,40px);border-radius:50%;background:rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.2);cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;z-index:9;touch-action:manipulation;}

#touch-hint{position:absolute;top:0;left:0;right:0;bottom:0;z-index:20;pointer-events:none;display:flex;align-items:stretch;opacity:1;transition:opacity .5s;}
#touch-hint.hidden{opacity:0;}
.touch-zone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.5vw,14px);padding:16px 8px;}
.touch-zone-left{background:rgba(0,0,0,.38);border-right:1px solid rgba(255,255,255,.1);}
.touch-zone-right{background:rgba(0,0,0,.38);}
.touch-zone-label{font-size:clamp(12px,3vw,15px);font-weight:900;font-family:var(--H1);color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.1em;text-align:center;}
.touch-zone-sub{font-size:clamp(9px,2.3vw,11px);font-weight:700;font-family:var(--H2);color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.06em;text-align:center;}
#touch-flash-left,#touch-flash-right{position:absolute;top:0;bottom:0;width:clamp(44px,11vw,60px);z-index:9;pointer-events:none;opacity:0;transition:opacity .08s;}

#touch-flash-right{right:0;background:linear-gradient(270deg,rgba(255,153,0,.3) 0%,transparent 100%);}

.tuto-rule-badge.orange{background:#ff9900;color:#ffffff;}
.tuto-rule-badge.red{background:var(--red);color:var(--white);}

#screen-form{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;animation:fadeIn .25s ease;}

// Rebuild earnedVouchers from a best score (used when restoring from sheet)
function vouchersFromScore(score){
  var result=[];
  var TIERS=[
    {disc:'60 DH',code:'GWOF-602024',label:'LÉGENDE',min:750,pts:5000},
    {disc:'50 DH',code:'GWOF-509162',label:'CHAMPION',min:600,pts:2000},
    {disc:'30 DH',code:'GWOF-304364',label:'MATCH READY',min:400,pts:750},
    {disc:'20 DH',code:'GWOF-200789',label:'DÉBUTANT',min:240,pts:300},
    {disc:'10 DH',code:'GWOF-107655',label:'STARTER',min:120,pts:0},
  ];
  for(var i=0;i<TIERS.length;i++){
    if(score>=TIERS[i].pts){
      result.push({score:score,disc:TIERS[i].disc,code:TIERS[i].code,label:TIERS[i].label,min:TIERS[i].min});
      break;
    }
  }
  return result;
}

// Fetch this player's name + best score from the sheet by email
async function fetchPlayerScore(email){
  var normalised = email.toLowerCase().trim();
  try{
    // Ensure leaderboard is fetched — this populates _playerIndex
    await fetchLeaderboard();
    // Direct O(1) lookup by email
    var match = _playerIndex[normalised];
    if(!match||!match.score) return null;
    return {
      name:     match.name     || '',
      lastName: match.lastName || '',
      email:    match.email    || normalised,
      score:    match.score,
    };
  }catch(e){ return null; }
}

async function doLogin(){

    inp.style.borderColor='#ec2326';

    return;

    if(lbl)lbl.style.display='block';
    if(spn)spn.style.display='none';

// ── Leaderboard cache — 30s TTL to avoid hammering the sheet ──
var _lbdCache = null, _lbdCacheTs = 0;
var _playerIndex = {}; // email → {name,lastName,score} — full lookup table

async function fetchLeaderboard(){
  if(_lbdCache && (Date.now()-_lbdCacheTs)<30000) return _lbdCache;
  // Fetch more rows so fetchPlayerScore can find anyone, not just top 50
  const tq=encodeURIComponent('SELECT B,C,E ORDER BY E DESC LIMIT 500');
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}&tq=${tq}`;
  try{
    const res=await fetch(url);const text=await res.text();
    const json=JSON.parse(text.replace(/^[^(]+\(/,'').replace(/\);?\s*$/,''));
    if(!json.table||!json.table.rows){_lbdCache=[];_lbdCacheTs=Date.now();return[];}

    // Build full player index keyed by email (best score per email)
    _playerIndex = {};
    json.table.rows
      .filter(function(r){return r.c&&r.c[2]&&r.c[2].v!=null;})
      .forEach(function(r){
        var name  = String((r.c[0]&&r.c[0].v)||'').trim();
        var email = String((r.c[1]&&r.c[1].v)||'').toLowerCase().trim();
        var score = Number(String((r.c[2]&&r.c[2].v)||0).replace(/[\s,]/g,''))||0;
        if(!email) return;
        if(!_playerIndex[email] || score > _playerIndex[email].score){
          var parts = name.split(' ');
          _playerIndex[email] = {name:parts[0]||'', lastName:parts.slice(1).join(' ')||'', email:email, score:score};
        }
      });

    // Leaderboard display: deduplicate by email (best score per player), keep top 50
    // Using _playerIndex which already holds best score per email
    var result = Object.values(_playerIndex)
      .sort(function(a,b){return b.score-a.score;})
      .slice(0,50);

    _lbdCache=result;_lbdCacheTs=Date.now();
    return result;
  }catch(e){return _lbdCache||[];}
}

      <button class="btn-lbd-back" onclick="goTo(renderLobby)">← RETOUR</button>
    </div>
  </div>`;
  fetchLeaderboard().then(players=>{
    const card=$('lbd-card');if(!card)return;
    if(!players.length){card.innerHTML='<div class="lbd-empty">Sois le premier à entrer dans la légende — le terrain t\'attend !</div>';return;}

    const myEmail=playerEmail?playerEmail.toLowerCase().trim():'';
    const myName=(playerName+' '+playerLastName).trim().toLowerCase();
    let myIdx=-1;

    let rows=players.map((p,i)=>{
      const rank=i+1;
      const mc=rank===1?'gold':rank===2?'silver':rank===3?'bronze':'other';
      // Match by email first, fall back to full name match
      const emailMatch = myEmail && (p.email||'').toLowerCase().trim()===myEmail;
      const nameMatch  = !myEmail && myName && (p.name||'').toLowerCase().trim()===myName;
      const isMe = (emailMatch||nameMatch) && (hasPlayedOnce||myEmail);
      if(isMe && myIdx===-1) myIdx=i;
      const fullName = [p.name, p.lastName].filter(Boolean).join(' ') || 'Joueur';
      const pts=Number(p.score).toLocaleString('fr-FR')+' pts';
      const you=isMe?'<span class="lbd-you-badge">TOI</span>':'';
      const prizeTag = rank<=3 ? '<span style="font-size:clamp(7px,1.8vw,8px);font-weight:700;color:#ff9900;font-family:var(--H2);background:#fff8ee;border:0.5px solid rgba(255,153,0,.4);border-radius:3px;padding:1px 5px;margin-left:4px;vertical-align:middle;white-space:nowrap;">🎁 '+WEEKLY_PRIZE.sponsor+'</span>' : '';
      return`<div class="lbd-row${isMe?' mine':''}" id="lbd-row-${i}"><div class="lbd-medal ${mc}">${rank}</div><div class="lbd-name">${fullName}${you}${prizeTag}</div><div class="lbd-score">${pts}</div></div>`;
    }).join('');
    card.innerHTML=rows;

    if(myIdx>=0){
      const myScore = players[myIdx].score;
      const p3score = players[2] ? players[2].score : null;
      let proximityHTML = '';

      if(myIdx===0){
        const p2=players[1];
        const gap2=p2?myScore-p2.score:null;
        proximityHTML=`<div class="lbd-proximity">🥇 TU ES EN TÊTE !<span>${gap2>0?'Tu mènes de '+Number(gap2).toLocaleString('fr-FR')+' pts sur le 2ème — reste devant !':'Profite — mais ils arrivent !'}</span></div>`;
      } else if(myIdx===1){
        const gapUp=players[0].score-myScore;
        const gapDown=players[2]?myScore-players[2].score:null;
        const downPart=gapDown>0?' · '+Number(gapDown).toLocaleString('fr-FR')+' pts d\'avance sur le 3ème':'';
        proximityHTML=`<div class="lbd-proximity">🥈 À <b>${Number(gapUp).toLocaleString('fr-FR')} pts</b> de la 1ère place !<span>Tu es 2ème${downPart} — rejoue !</span></div>`;
      } else if(myIdx===2){
        const gapUp=players[1].score-myScore;
        proximityHTML=`<div class="lbd-proximity">🥉 TU ES 3ème !<span>À ${Number(gapUp).toLocaleString('fr-FR')} pts de la 2ème place — rejoue !</span></div>`;
      } else {
        const gap3 = p3score!=null ? p3score - myScore : null;
        const above=players[myIdx-1];
        const gapAbove=above?above.score-myScore:null;
        if(gap3!=null&&gap3>0){
          proximityHTML=`<div class="lbd-proximity">À <b>${Number(gap3).toLocaleString('fr-FR')} pts</b> de la 3ème place 🥉<span>${gapAbove>0?'Passe d\'abord le '+myIdx+'ème (+'+Number(gapAbove).toLocaleString('fr-FR')+' pts)':'Rejoue — le podium est à portée !'}</span></div>`;
        } else if(gap3===0){
          proximityHTML=`<div class="lbd-proximity">Tu es à égalité avec le 3ème !<span>Un point de plus et tu es dans le Top 3 🥉</span></div>`;
        }
      }

      if(proximityHTML){
        const d=document.createElement('div');
        d.innerHTML=proximityHTML;
        card.insertBefore(d.firstChild,card.firstChild);
      }

      // Scroll the overflow container to center the player's row
      // scrollIntoView doesn't work reliably inside overflow:auto containers on mobile
      setTimeout(function(){
        var row=document.getElementById('lbd-row-'+myIdx);
        var container=document.querySelector('.lbd-scroll');
        if(!row||!container)return;
        var containerRect=container.getBoundingClientRect();
        var rowRect=row.getBoundingClientRect();
        // Current scroll + row's offset from container top − half container height + half row height
        var target = container.scrollTop + (rowRect.top - containerRect.top) - (containerRect.height/2) + (rowRect.height/2);
        container.scrollTo({top:Math.max(0,target), behavior:'smooth'});
      },350);
    }
  }).catch(()=>{const c=$('lbd-card');if(c)c.innerHTML='<div class="lbd-empty">Classement hors ligne — réessaie dans un instant.</div>';});
}

  const fw=getFW();gloveX=fw/2;
  const ge=$('glove-el');
  if(ge){ge.style.left='0px';ge.style.top=CATCH_Y(getFH())+'px';var _itx=Math.round(gloveX-GW/2);ge.style.webkitTransform='translate3d('+_itx+'px,0,0)';ge.style.transform='translate3d('+_itx+'px,0,0)';}

  const field=$('game-field');
  const flashL=$('touch-flash-left'),flashR=$('touch-flash-right'),hint=$('touch-hint');

  var _touchAnchor = {};
  var _primaryId   = -1;
  window._swipeActive = false;
  window._swipeVel    = 0;

  function dismissHint(){
    if(touchHintDismissed)return;touchHintDismissed=true;
    if(hint){hint.classList.add('hidden');setTimeout(function(){if(hint)hint.style.display='none';},600);}
  }

  function _applyGlovePos(fingerX){
    var fw=getFW();
    gloveX=Math.max(GW/2,Math.min(fw-GW/2,fingerX));
    var ge=document.getElementById('glove-el');
    if(ge){
      var tx=Math.round(gloveX-GW/2);
      ge.style.webkitTransform='translate3d('+tx+'px,0,0)';
      ge.style.transform      ='translate3d('+tx+'px,0,0)';
    }
    window._swipeDir = fingerX < (getFW()/2) ? 'l' : 'r';
  }

  field.addEventListener('touchstart',function(e){
    e.preventDefault();
    dismissHint();
    lastPressTime=Date.now();
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      _touchAnchor[t.identifier]={lastX:t.clientX,startGloveX:gloveX};
      if(_primaryId===-1){
        _primaryId=t.identifier;
        _applyGlovePos(t.clientX);
      }
    }
    window._swipeActive=true;
    window._swipeVel=0;
  },{passive:false});

  field.addEventListener('touchmove',function(e){
    e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      if(t.identifier!==_primaryId)continue;
      var anchor=_touchAnchor[t.identifier];
      if(!anchor)continue;
      window._swipeVel=t.clientX-anchor.lastX;
      anchor.lastX=t.clientX;
      _applyGlovePos(t.clientX);
    }
  },{passive:false});

  field.addEventListener('touchend',function(e){
    e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++){
      var id=e.changedTouches[i].identifier;
      delete _touchAnchor[id];
      if(_primaryId===id){
        var remaining=Object.keys(_touchAnchor);
        _primaryId=remaining.length>0?parseInt(remaining[0]):-1;
      }
    }
    if(_primaryId===-1){
      window._swipeActive=false;
    }
  },{passive:false});

  field.addEventListener('touchcancel',function(){
    _touchAnchor={};_primaryId=-1;
    window._swipeActive=false;window._swipeVel=0;
  },{passive:false});

  var _mDown=false,_mLast=0;
  field.addEventListener('pointerdown',function(e){
    if(e.pointerType==='touch')return;
    _mDown=true;_mLast=e.clientX;
    dismissHint();lastPressTime=Date.now();window._swipeActive=true;window._swipeVel=0;
    _applyGlovePos(e.clientX);
  });
  field.addEventListener('pointermove',function(e){
    if(e.pointerType==='touch'||!_mDown)return;
    var dx=e.clientX-_mLast;_mLast=e.clientX;
    window._swipeVel=dx;
    _applyGlovePos(e.clientX);
  });
  field.addEventListener('pointerup',function(e){
    if(e.pointerType==='touch')return;
    _mDown=false;window._swipeActive=false;
  });

  function _flushFlash(){
    if(!flashL||!flashR)return;
    var d=window._swipeDir;
    if(d==='l'){flashL.classList.add('active');flashR.classList.remove('active');}
    else if(d==='r'){flashR.classList.add('active');flashL.classList.remove('active');}
    if(!window._swipeActive){flashL.classList.remove('active');flashR.classList.remove('active');window._swipeDir=null;}
  }
  window._swipeDir=null;
  window._flushFlash=_flushFlash;

  const co=$('btn-cashout');
  if(co){
    let armed=false,timer=null;
    co.addEventListener('pointerdown',()=>{
      if(!armed){armed=true;co.textContent='Sûr(e) ?';co.classList.add('confirm-mode');timer=setTimeout(()=>{armed=false;co.innerHTML='<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><circle cx="5" cy="5" r="4.5" stroke="currentColor" stroke-width="1.2"/><line x1="5" y1="1.5" x2="5" y2="5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="5" y1="5" x2="7.5" y2="5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>Encaisser';co.classList.remove('confirm-mode');},2500);}
      else{clearTimeout(timer);endGame(scoreVal);}
    });
  }

  const mb=$('btn-mute');
  if(mb)mb.addEventListener('pointerdown',()=>toggleMusic(mb));
}

// ── CACHED DOM REFS (populated once per game, cleared on end) ──
var _domCache = {};
function _dom(id){ return _domCache[id] || (_domCache[id] = document.getElementById(id)); }
function _clearDomCache(){ _domCache = {}; }

function startGame(){
  _track('game_start',{attempts_left:attempts});
  startMusic();
  done=false;wid=0;itemsArr=[];
  livesVal=3;scoreVal=0;comboVal=0;maxComboVal=0;speedVal=1.1;elapsedSec=0;lastTierReached=0;
  lastT=null;lastSpawn=0;spawnInt=2000;pressDir=null;lastPressTime=0;touchHintDismissed=false;
  window._swipeVel=0;window._swipeActive=false;
  window._adrenaline=false;window._adrenalineShown=false;
  _clearDomCache();
  renderGame();
  gloveX=getFW()/2;
  // Pre-cache all game DOM refs immediately after render
  _dom('glove-el');_dom('glove-shake');_dom('score-disp');_dom('combo-badge');
  _dom('danger-bar');_dom('dodge-hint');_dom('screen-game');
  _dom('lives-count');_dom('lives-heart-img');_dom('catch-ring');
  _dom('game-field');
  updateLivesDisplay();
  animId=requestAnimationFrame(tick);
}

function updateLivesDisplay(){
  var b=_dom('lives-count'),h=_dom('lives-heart-img');
  if(b)b.textContent=livesVal;
  if(h){h.style.transform='scale(1.4)';setTimeout(function(){var img=_dom('lives-heart-img');if(img)img.style.transform='scale(1)';},200);
    h.style.filter=livesVal===1?'drop-shadow(0 0 8px rgba(236,35,38,.9))':'drop-shadow(0 3px 10px rgba(0,0,0,.5))';}
}

function tick(ts){
  if(done)return;
  if(!lastT)lastT=ts;
  const dt=Math.min((ts-lastT)/16,3);lastT=ts;
  // Cache fw/fh once per frame — not recalculated inside loop
  const fw=getFW(),fh=getFH(),cy=CATCH_Y(fh);
  elapsedSec+=dt/60;

  var isAdrenaline = elapsedSec >= 90;
  if(isAdrenaline && !window._adrenalineShown){
    window._adrenalineShown=true;
    window._adrenaline=true;
    showTierUp('VITESSE MAX !','⚡');
    var hud=_dom('screen-game');
    if(hud)hud.style.animation='adrenalinePulse 1.2s ease-in-out infinite';
  }

  var speedBase = isAdrenaline
    ? Math.min(7.0, 3.0 + (elapsedSec-90)*0.06)
    : Math.min(4.0, 1.1 + elapsedSec*0.03);
  speedVal = speedBase;

  var spawnBase = isAdrenaline
    ? Math.max(380, 900 - (elapsedSec-90)*8)
    : Math.max(750, 2200 - elapsedSec*22);
  spawnInt = spawnBase;

  // ── COAST MOMENTUM ───────────────────────────────────────
  if(!window._swipeActive && window._swipeVel){
    var coastDelta = window._swipeVel * 0.45;
    if(Math.abs(coastDelta) > 0.5){
      gloveX = Math.max(GW/2, Math.min(fw-GW/2, gloveX + coastDelta));
      window._swipeVel = coastDelta;
      var ge2=_dom('glove-el');
      if(ge2){
        var tx2=Math.round(gloveX-GW/2);
        ge2.style.webkitTransform='translate3d('+tx2+'px,0,0)';
        ge2.style.transform      ='translate3d('+tx2+'px,0,0)';
      }
    } else { window._swipeVel=0; }
  }
  if(window._flushFlash) window._flushFlash();

  // Use cached glove ref
  const ge=_dom('glove-el');

  // ── SPAWN ────────────────────────────────────────────────
  // Cap max items on screen to prevent GC thrash on low-RAM
  const MAX_ITEMS = 8;
  if(ts-lastSpawn>spawnInt && itemsArr.length<MAX_ITEMS){
    const item=spawnItem(speedVal);itemsArr.push(item);lastSpawn=ts;addItemEl(item);
    if(elapsedSec>45 && itemsArr.length<MAX_ITEMS-1){
      var extraChance = isAdrenaline ? 0.70 : 0.35;
      if(Math.random()<extraChance){
        setTimeout(function(){if(done||itemsArr.length>=MAX_ITEMS)return;var i2=spawnItem(speedVal*0.88);itemsArr.push(i2);addItemEl(i2);},280);
      }
      if(isAdrenaline && Math.random()<0.40 && itemsArr.length<MAX_ITEMS-1){
        setTimeout(function(){if(done||itemsArr.length>=MAX_ITEMS)return;var i3=spawnItem(speedVal*0.78);itemsArr.push(i3);addItemEl(i3);},520);
      }
    }
  }

  // ── ITEM LOOP — index-based to avoid .filter() GC alloc ──
  let livesLost=0,ptsGained=0,newCombo=comboVal,closestRed=9999;
  var writeIdx=0;
  for(var ri=0;ri<itemsArr.length;ri++){
    var item=itemsArr[ri];
    item.y+=item.speed*dt;
    var el=document.getElementById('w-'+item.id);
    if(el) el.style.top=Math.round(item.y)+'px';
    var cx=item.x+item.width/2, inGlove=cx>=gloveX-GW/2&&cx<=gloveX+GW/2;

    // Danger proximity for red cards
    if(item.type==='redcard'){
      var d=cy-item.y;
      if(d>0&&d<closestRed)closestRed=d;
      if(el){if(d<100)el.classList.add('danger-close');else el.classList.remove('danger-close');}
    }

    var caught=false, remove=false;
    if(item.y+item.height*.5>=cy && item.y<cy+GH){
      if(inGlove){
        caught=true;
        if(item.type==='ball'){
          newCombo++;var pts=Math.round((25+Math.floor(elapsedSec)*.3)*Math.min(newCombo,3));ptsGained+=pts;
          showFlash(Math.min(Math.max(cx-30,0),fw-80),cy-44,'+'+pts+' ARRÊT !',true);sfxCatch();triggerRing(gloveX,cy);
          if(ge){ge.classList.add('catching');setTimeout(function(){var g=_dom('glove-el');if(g)g.classList.remove('catching');},300);}
        }else if(item.type==='golden'){
          newCombo++;var pts=Math.round((75+Math.floor(elapsedSec)*.3)*Math.min(newCombo,3));ptsGained+=pts;
          showFlash(Math.min(Math.max(cx-40,0),fw-100),cy-44,'BONUS +'+pts,true);sfxGolden();triggerRing(gloveX,cy);
          if(ge){ge.classList.add('catching');setTimeout(function(){var g=_dom('glove-el');if(g)g.classList.remove('catching');},300);}
        }else{
          // Red card — check swipe dodge
          if(Date.now()-lastPressTime<180){caught=false;remove=true;}
          else{
            newCombo=0;livesLost++;
            showFlash(Math.min(Math.max(cx-40,0),fw-100),cy-50,'ROUGE !',false);sfxRedCard();
            var sg=_dom('screen-game');if(sg){sg.classList.add('hit-flash');setTimeout(function(){var s=_dom('screen-game');if(s)s.classList.remove('hit-flash');},400);}
            var gs=_dom('glove-shake');if(gs){gs.classList.remove('big-shake');void gs.offsetWidth;gs.classList.add('big-shake');setTimeout(function(){var s=_dom('glove-shake');if(s)s.classList.remove('big-shake');},500);}
          }
        }
        remove=true;
      }
    }
    if(!remove && item.y>fh+10){
      if(item.type==='ball'||item.type==='golden'){
        newCombo=0;
        var cb=_dom('combo-badge');if(cb)cb.style.display='none';
      }
      remove=true;
    }
    if(remove){
      if(el)el.remove();
    } else {
      itemsArr[writeIdx++]=item;
    }
  }
  itemsArr.length=writeIdx; // truncate in-place — no GC alloc

  // ── DANGER BAR ───────────────────────────────────────────
  var db=_dom('danger-bar'),dh=_dom('dodge-hint');
  if(db){
    if(closestRed<120){
      var di=Math.max(0,(120-closestRed)/120);
      db.style.height=(di*8)+'px';db.style.opacity=di;
      if(dh){dh.style.top=(cy-48-(di*12))+'px';dh.style.opacity=closestRed<60?'1':'0';}
    }else{
      db.style.height='0';db.style.opacity='0';
      if(dh)dh.style.opacity='0';
    }
  }

  comboVal=newCombo;if(newCombo>maxComboVal)maxComboVal=newCombo;

  if(ptsGained){
    scoreVal+=ptsGained;
    var sd=_dom('score-disp');if(sd)sd.textContent=scoreVal;
    // Tier-up toasts
    const tiers=[{t:5000,l:'LÉGENDE',d:'60 DH'},{t:2000,l:'CHAMPION',d:'50 DH'},{t:750,l:'MATCH READY',d:'30 DH'},{t:300,l:'DÉBUTANT',d:'20 DH'}];
    for(var ti=0;ti<tiers.length;ti++){
      if(scoreVal>=tiers[ti].t&&lastTierReached<tiers[ti].t){lastTierReached=tiers[ti].t;showTierUp(tiers[ti].l,tiers[ti].d);break;}
    }
    // Score circle ring — cached via querySelector (called once on first pts gain)
    if(!_domCache['_circle'])_domCache['_circle']=document.querySelector('.score-circle');
    var circle=_domCache['_circle'];
    if(circle){
      var ring = scoreVal>=5000?'0 0 0 3px rgba(255,230,80,1),0 4px 20px rgba(0,0,0,.5)':
                 scoreVal>=2000?'0 0 0 3px rgba(255,186,0,1),0 4px 20px rgba(0,0,0,.5)':
                                '0 0 0 3px var(--orange),0 4px 20px rgba(0,0,0,.5)';
      circle.style.boxShadow=ring;
    }
  }

  var cb=_dom('combo-badge');
  if(cb){cb.style.display=newCombo>1?'inline-block':'none';cb.textContent='×'+Math.min(newCombo,3)+' COMBO';}

  if(livesLost){livesVal=Math.max(0,livesVal-livesLost);updateLivesDisplay();if(livesVal<=0){endGame(scoreVal);return;}}
  animId=requestAnimationFrame(tick);
}

function addItemEl(item){
  var field=_dom('game-field');if(!field)return;
  var el=document.createElement('div');
  el.id='w-'+item.id;
  el.style.left=item.x+'px';
  el.style.top=item.y+'px';
  if(item.type==='ball'){el.className='falling-item item-ball';el.innerHTML='<img src="'+IMG_SOCCER+'" alt="" draggable="false">';}
  else if(item.type==='golden'){el.className='falling-item item-golden';el.innerHTML='<img src="'+IMG_GOLDEN+'" alt="" draggable="false">';}
  else{el.className='falling-item item-redcard';el.style.width=item.width+'px';el.style.height=item.height+'px';el.innerHTML='<img src="'+IMG_REDCARD+'" alt="" draggable="false">';}
  field.appendChild(el);
}

function triggerRing(x,y){
  var r=_dom('catch-ring');if(!r)return;
  r.style.left=(x-30)+'px';r.style.top=(y-30)+'px';r.style.width='60px';r.style.height='60px';
  r.classList.remove('pop');void r.offsetWidth;r.classList.add('pop');
  setTimeout(function(){var ring=_dom('catch-ring');if(ring)ring.classList.remove('pop');},320);
}

function showFlash(x,y,text,good){
  const field=$('game-field');if(!field)return;
  const el=document.createElement('div');el.className='flash-msg';el.textContent=text;
  el.style.cssText=`left:${x}px;top:${y}px;background:${good?'#ff9900':'#ec2326'};color:${good?'#403b3b':'#fff'};`;
  field.appendChild(el);setTimeout(()=>el.remove(),1100);
}

function endGame(final){
  if(done)return;done=true;
  cancelAnimationFrame(animId);
  stopMusic();
  scoreVal=final;
  attempts=Math.max(0,attempts-1);
  _track('game_end',{score:final,combo:Math.min(maxComboVal,3),survie:Math.floor(elapsedSec),voucher:getVoucher(final).code});
  var _prevBest=bestScore;
  if(final>bestScore)bestScore=final;
  if(final>_prevBest&&_prevBest>0){window._newRecord=true;}else{window._newRecord=false;}
  var ev=getVoucher(final);
  var tierKey=ev.code;
  var existing=earnedVouchers.filter(function(x){return x.code===tierKey;})[0];
  if(!existing||final>existing.score){
    earnedVouchers=earnedVouchers.filter(function(x){return x.code!==tierKey;});
    earnedVouchers.push({score:final,disc:ev.disc,code:ev.code,label:ev.label,min:ev.min,date:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})});
  }
  hasPlayedOnce=true;
  saveSession(); // always persist attempts count (works for anonymous players too)
  // Bust leaderboard cache so next open shows fresh data with this score
  _lbdCache=null;_lbdCacheTs=0;
  // Inject player into _playerIndex immediately so they appear in leaderboard
  // even before the sheet has processed the submission
  if(playerEmail){
    var _myEmail=playerEmail.toLowerCase().trim();
    if(!_playerIndex[_myEmail]||final>(_playerIndex[_myEmail].score||0)){
      _playerIndex[_myEmail]={name:playerName||'Joueur',lastName:playerLastName||'',email:_myEmail,score:final};
    }
  }
  if(SHEET_URL.startsWith('https://')&&playerName){
    const p=new URLSearchParams({timestamp:new Date().toISOString(),name:playerName+(playerLastName?' '+playerLastName:''),email:playerEmail,city:playerCity,score:final,combo:Math.min(maxComboVal,3),survie:Math.floor(elapsedSec),voucher:getVoucher(final).code,source:'JumiaGardienDeBut'});
    fetch(SHEET_URL+'?'+p.toString(),{method:'GET',mode:'no-cors'}).catch(()=>{});
  }
  if(!playerName){goTo(renderFormPost);}else{goTo(function(){renderMyVouchers(true)});}
}

function submitForm(){
  var _n=$('inp-name');const name=_n?_n.value.trim():'';
  var _ln=$('inp-lastname');const lastname=_ln?_ln.value.trim():'';
  var _em=$('inp-email');const email=_em?_em.value.trim():'';
  var _ct=$('inp-city');const city=_ct?_ct.value.trim():'';
  let valid=true;
  const emailRe=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const testRe=/^(test|demo|fake|dummy|admin|user|azerty|qwerty|asdf|aaa+|bbb+|xxx+|abc|123|nom|foo|bar|na|none)$/i;
  const repeat=/^(.)\1{2,}$/;
  const testEmail=/(test|fake|demo|dummy|mailinator|yopmail|trashmail|tempmail|maildrop)/i;
  const fields=[
    ['inp-name','err-name',name.length<2||testRe.test(name)||repeat.test(name),'Prénom invalide'],
    ['inp-lastname','err-lastname',lastname.length<2||testRe.test(lastname)||repeat.test(lastname),'Nom invalide'],
    ['inp-email','err-email',!emailRe.test(email)||testEmail.test(email),'E-mail invalide'],
    ['inp-city','err-city',city.length<2||testRe.test(city)||repeat.test(city),'Ville invalide'],
  ];
  fields.forEach(function(_f){var id=_f[0],eid=_f[1],fail=_f[2],msg=_f[3];var _fe=$(id);if(_fe)_fe.classList.toggle('error',fail);const em=$(eid);if(em){em.textContent=msg;em.classList.toggle('visible',fail);}if(fail)valid=false;});
  if(!valid)return;

  // Show spinner while we check
  const btn=$('btn-submit'),lbl=$('submit-label'),spn=$('submit-spinner');
  if(btn)btn.disabled=true;if(lbl)lbl.style.display='none';if(spn)spn.style.display='block';

  var normEmail=email.toLowerCase().trim();

  // ── Check if this email already exists in the sheet ──────────
  fetchPlayerScore(normEmail).then(function(existing){

    if(existing && existing.score > 0){
      // ── RETURNING PLAYER ─────────────────────────────────────
      // Restore their best score (keep whichever is higher)
      playerName     = existing.name     || name;
      playerLastName = existing.lastName || lastname;
      playerEmail    = normEmail;
      playerCity     = city || playerCity;
      // Keep the higher of existing best or current game score
      bestScore      = Math.max(existing.score, scoreVal, bestScore);
      earnedVouchers = vouchersFromScore(bestScore);
      hasPlayedOnce  = true;
      saveSession();
      // Still submit this game's score to sheet (new row = new attempt logged)
      if(SHEET_URL.startsWith('https://')){
        const p=new URLSearchParams({timestamp:new Date().toISOString(),name:playerName+' '+playerLastName,email:playerEmail,city:playerCity,score:scoreVal,combo:Math.min(maxComboVal,3),survie:Math.floor(elapsedSec),voucher:getVoucher(scoreVal).code,source:'JumiaGardienDeBut'});
        fetch(SHEET_URL+'?'+p.toString(),{method:'GET',mode:'no-cors'}).catch(()=>{});
      }
      _lbdCache=null;_lbdCacheTs=0;
      _playerIndex[normEmail]={name:playerName,lastName:playerLastName,email:normEmail,score:bestScore};
      goTo(function(){renderMyVouchers(true)});

    } else {
      // ── NEW PLAYER ───────────────────────────────────────────
      playerName=name;playerLastName=lastname;playerEmail=normEmail;playerCity=city;
      _track('form_submit',{email:normEmail,score:scoreVal,is_new:true});
      saveSession();
      _lbdCache=null;_lbdCacheTs=0;
      _playerIndex[normEmail]={name:name,lastName:lastname,email:normEmail,score:scoreVal};
      if(SHEET_URL.startsWith('https://')){
        const p=new URLSearchParams({timestamp:new Date().toISOString(),name:playerName+' '+playerLastName,email:playerEmail,city:playerCity,score:scoreVal,combo:Math.min(maxComboVal,3),survie:Math.floor(elapsedSec),voucher:getVoucher(scoreVal).code,source:'JumiaGardienDeBut'});
        fetch(SHEET_URL+'?'+p.toString(),{method:'GET',mode:'no-cors'}).catch(()=>{});
      }
      goTo(function(){renderMyVouchers(true)});
    }

  }).catch(function(){
    // Network error — proceed as new player, don't block
    playerName=name;playerLastName=lastname;playerEmail=normEmail;playerCity=city;
    saveSession();
    _lbdCache=null;_lbdCacheTs=0;
    _playerIndex[normEmail]={name:name,lastName:lastname,email:normEmail,score:scoreVal};
    if(SHEET_URL.startsWith('https://')){
      const p=new URLSearchParams({timestamp:new Date().toISOString(),name:playerName+' '+playerLastName,email:playerEmail,city:playerCity,score:scoreVal,combo:Math.min(maxComboVal,3),survie:Math.floor(elapsedSec),voucher:getVoucher(scoreVal).code,source:'JumiaGardienDeBut'});
      fetch(SHEET_URL+'?'+p.toString(),{method:'GET',mode:'no-cors'}).catch(()=>{});
    }
    goTo(function(){renderMyVouchers(true)});
  });
}

async function doLobbyLogin(){
  var inp=document.getElementById('lobby-login-email');
  var btn=document.getElementById('lobby-login-btn');
  var lbl=document.getElementById('lobby-login-label');
  var spn=document.getElementById('lobby-login-spinner');
  var msg=document.getElementById('lobby-login-msg');
  if(!inp)return;

  var email=inp.value.trim().toLowerCase();
  var emailRe=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if(!emailRe.test(email)){
    inp.style.borderColor='#ec2326';
    if(msg){msg.style.color='#ec2326';msg.textContent='Adresse e-mail invalide.';}
    return;
  }

  // Show spinner
  if(btn)btn.disabled=true;
  if(lbl)lbl.style.display='none';
  if(spn)spn.style.display='block';
  if(msg){msg.style.color='#8A8A9A';msg.textContent='Recherche en cours...';}

  var result=await fetchPlayerScore(email);

  if(result&&result.score>0){
    // Found — restore session and go straight to vouchers
    playerEmail=email;
    playerName=result.name||'';
    playerLastName=result.lastName||'';
    bestScore=result.score;
    earnedVouchers=vouchersFromScore(result.score);
    hasPlayedOnce=true;
    saveSession();
    goTo(function(){renderMyVouchers(false);});
  } else {
    // Not found — pre-fill email, show message, auto-redirect to lobby to play
    playerEmail=email;
    if(btn)btn.disabled=false;
    if(lbl)lbl.style.display='block';
    if(spn)spn.style.display='none';
    if(msg){msg.style.color='#e68800';msg.textContent='Aucun bon trouvé — joue pour en gagner !';}
    setTimeout(function(){goTo(renderLobby);},1500);
  }
}

function doLogout(){
  clearSession();
  goTo(renderLobby);
}

// ── ATTEMPTS MIDNIGHT COUNTDOWN ──────────────────────────────
function startAttemptsCountdown(){
  var el=document.getElementById('attempts-countdown');
  if(!el)return;
  function update(){
    var now=new Date();
    var midnight=new Date(now);
    midnight.setHours(24,0,0,0);
    var diff=Math.max(0,midnight-now);
    var h=Math.floor(diff/3600000);
    var m=Math.floor((diff%3600000)/60000);
    var s=Math.floor((diff%60000)/1000);
    var str='Tes essais reviennent dans '+
      String(h).padStart(2,'0')+'h '+
      String(m).padStart(2,'0')+'m '+
      String(s).padStart(2,'0')+'s';
    var el2=document.getElementById('attempts-countdown');
    if(el2){el2.textContent=str;}else{clearInterval(_attTimer);}
  }
  update();
  var _attTimer=setInterval(update,1000);
}

// ── VOUCHER EXPIRY COUNTDOWN (midnight same day) ─────────────
function startExpiryCountdowns(){
  var spans=document.querySelectorAll('[id^="expiry-"]');
  if(!spans.length)return;
  function update(){
    var now=new Date();
    var midnight=new Date(now);midnight.setHours(24,0,0,0);
    var diff=Math.max(0,midnight-now);
    var h=Math.floor(diff/3600000);
    var m=Math.floor((diff%3600000)/60000);
    var s=Math.floor((diff%60000)/1000);
    var str=String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'m '+String(s).padStart(2,'0')+'s';
    document.querySelectorAll('[id^="expiry-"]').forEach(function(sp){sp.textContent=str;});
  }
  update();
  var _expTimer=setInterval(update,1000);
}

      var idx=players.findIndex(function(p){return(p.email||'').toLowerCase().trim()===myEmail;});
      if(idx>=0)myRank=idx+1;

function preloadAssets(){
  const images=[IMG_GLOVES,IMG_SOCCER,IMG_GOLDEN,IMG_REDCARD,
    "https://raw.githubusercontent.com/Madzack69/Icons/main/BG_GREEN_FIELD_OP.webp"];
  const bar=$('loading-bar'),gl=$('loading-gloves');
  if(gl)gl.src=IMG_GLOVES;
  const total=images.length;let loaded=0,finished=false;
  function tickLoad(){
    loaded++;
    if(bar)bar.style.width=Math.round((loaded/total)*100)+'%';
    if(loaded>=total&&!finished)finish();
  }
  function finish(){
    finished=true;if(bar)bar.style.width='100%';
    setTimeout(()=>{requestAnimationFrame(()=>{const s=$('loading-screen');if(s)s.classList.add('fade-out');setTimeout(()=>{
      const s2=$('loading-screen');if(s2)s2.remove();
      // ── SESSION RESTORE ──────────────────────────────────────
      const saved=loadSession();
      const todayStr=new Date().toISOString().slice(0,10);
      if(saved&&saved.email){
        playerEmail=saved.email||'';
        playerName=saved.name||'';
        playerLastName=saved.lastName||'';
        playerCity=saved.city||'';
        bestScore=saved.bestScore||0;
        earnedVouchers=saved.earnedVouchers||[];
        if(bestScore>0)hasPlayedOnce=true;
        // Restore attempts only if saved today — otherwise reset to 4 (new day)
        if(saved.attemptsDate===todayStr && typeof saved.attempts==='number'){
          attempts=saved.attempts;
        } else {
          attempts=4;
          saveSession(); // persist the reset
        }
      } else {
        // No session — check if there's a legacy attempts store
        attempts=4;
      }
      // Always land on lobby — login is inline
      renderLobby();
    },420);});},350);
  }
  images.forEach(src=>{const i=new Image();i.onload=tickLoad;i.onerror=tickLoad;i.src=src;});
  // Music is lazy — don't load at startup, saves memory on low-RAM devices
  // Tick load count accounts for this
  setTimeout(()=>{if(!finished)finish();},5000);
}

preloadAssets();
